<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- "no", not "yes", and it is a TRADE. "yes" makes the home-screen copy
     STANDALONE: no address bar, no tab button, no way back to Safari at all -
     that is what standalone means, not a bug to be worked around - and about
     110px more game. "no" opens it as an ordinary Safari tab from the same
     icon, with the URL and tabs where they always are, and the game gets the
     screen Safari leaves it. One word switches it back. -->
<meta name="apple-mobile-web-app-capable" content="no">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<!-- SAVED TO THE HOME SCREEN. apple-touch-icon is the picture that ends up on
     it - 180x180, tools/make_icon.py, the runner cropped out of the title card
     because the card's lettering is illegible at that size - and
     apple-mobile-web-app-title is the name under it, short enough not to be
     cut with an ellipsis. Safari rounds the corners itself. With
     apple-mobile-web-app-capable above, opening it from there runs the game
     with no address bar and no toolbar, which is ~100px of phone back. -->
<meta name="apple-mobile-web-app-title" content="Storage Sprint">
<link rel="apple-touch-icon" href="art/icon.png">
<link rel="icon" type="image/png" href="art/icon.png">
<meta name="theme-color" content="#3a3f45">

<!-- The preview card a link to the game gets in Messages. Its name comes from
     og:title, not <title> (Apple, TN3156). Its picture is art/preview.png, the
     title card framed at 1200x630 by tools/make_preview.py. og:url and og:image
     are ABSOLUTE and https, which is what every scraper wants; they point at
     the GitHub Pages address, so they move if the repo is ever renamed. -->
<meta property="og:title" content="Slumpd's Storage Sprint">
<meta property="og:description" content="Clear the unit. Load the truck. Don't get caught.">
<meta property="og:type" content="website">
<meta property="og:url"          content="https://wendysparkinglot.github.io/slumpds-storage-sprint/">
<meta property="og:image"        content="https://wendysparkinglot.github.io/slumpds-storage-sprint/art/preview.png">
<meta property="og:image:width"  content="1200">
<meta property="og:image:height" content="630">

<title>Slumpd's Storage Sprint</title>
<style>
  html, body {
    margin:0; padding:0; width:100%; height:100%;
    background:#23272b; overflow:hidden;
    overscroll-behavior:none; touch-action:none;
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
    font-family:ui-monospace,"SF Mono",Menlo,monospace;
    color:#e8e2d6;
  }
  body { position:fixed; inset:0; }

  /* Centred in what is left between the HUD strip and the thumb buttons, not
     pinned under the HUD: the view is shorter than the screen on a phone -
     deliberately, so that the roof is not half of it - and top-aligned left the
     game stranded at the top over a screen of empty dark. The top and bottom
     paddings are the same 64 and 224 resize() holds back, and both carry the
     safe-area inset - the HUD sits below the notch, so the stage has to as
     well or the status line is drawn over the top of the game. */
  /* THE TOP STRIP NEEDS A FLOOR, not just the inset. env(safe-area-inset-top)
     is the NOTCH: ~59px on a tall iPhone, and ZERO wherever the browser has
     already moved the page below its own furniture. 'inset + a bit' is right
     in the first case and puts the strip hard against the top edge in the
     second, which is how it stayed looking too high after being moved down
     once. So every top offset is max(floor, inset + gap): 96/84 for the stage,
     56/44 for the HUD, 52/40 for the mute button - whose 31px then end at 83,
     inside the stage's 96. resize() computes the same max for padTop, and the
     two HAVE to agree or the canvas is centred in a box it is not drawn in.
     Landscape keeps the tight numbers: 393px of height for the whole game. */
  #stage { position:fixed; inset:0; display:flex; align-items:center;
           justify-content:center;
           padding-top:max(96px, calc(env(safe-area-inset-top,0px) + 84px)); }
  @media (orientation: landscape) {
    #stage { padding-top:calc(env(safe-area-inset-top,0px) + 28px); }
  }
  @media (orientation: portrait) {
    body.touch #stage { padding-bottom:calc(env(safe-area-inset-bottom,0px) + 224px); }
  }

  canvas {
    display:block;
    image-rendering:pixelated; image-rendering:crisp-edges;
    box-shadow:0 0 0 3px #17171b, 0 20px 44px rgba(0,0,0,.6);
  }

  #hud {
    position:fixed; top:calc(env(safe-area-inset-top,0px) + 24px);
    left:0; right:0; text-align:center;
    font-size:13px; letter-spacing:.05em; color:#e8e2d6;
    pointer-events:none; text-shadow:0 2px 0 rgba(0,0,0,.7);
  }
  #hud b { color:#e0913c; font-weight:600; }
  #hud i { color:#d94f3d; font-style:normal; }
  /* A PORTRAIT PHONE CANNOT CENTRE THIS AND KEEP THE MUTE BUTTON OFF IT.
     Measured at 393px: the widest status line is 242px at 13px, the button is
     103px reading SOUND ON and 137 reading TAP FOR SOUND, and the two
     overlapped by 35. Centring is what has to give - there is no font size
     that keeps a 242px line inside the 172px a centred box has left. So the
     status goes LEFT and the button keeps the right, which reads as a layout
     rather than as a collision, at 12px, where the widest line is 223 against
     the 241 left over. */
  @media (orientation: portrait) {
    #hud { top:max(56px, calc(env(safe-area-inset-top,0px) + 44px));
           text-align:left; font-size:12px;
           padding-left:calc(env(safe-area-inset-left,0px) + 12px);
           padding-right:calc(env(safe-area-inset-right,0px) + 140px); }
  }

  /* env(safe-area-inset-*) is a CSS value and script cannot read one. This is
     padded by two of them so resize() can measure them off it. */
  #safe { position:fixed; top:0; left:0; width:0; height:0; visibility:hidden;
          padding-top:env(safe-area-inset-top,0px);
          padding-bottom:env(safe-area-inset-bottom,0px); }

  #pad { display:none; }
  #pad.on { display:block; }
  /* NOT UNDER A SHEET. The pad is fixed and draws over the score sheet, so on
     a finished run RUN IT BACK sat on top of the d-pad - two live touch
     targets in the same place, and the pad is the one that swallows the tap.
     Hidden, its rects measure zero and hitTest() returns null for everything,
     which is the same answer twice: nothing on the pad can be pressed while a
     sheet is up. refreshPadRects() has to run when this changes. */
  body.sheeted #pad.on { display:none; }

  /* JUMP, alone on the right. .btn is only this one button now - DOWN used to
     sit above it and is an arm of the d-pad instead. */
  .btn {
    position:fixed; bottom:calc(env(safe-area-inset-bottom,0px) + 22px);
    width:76px; height:76px; border-radius:16px;
    background:rgba(224,145,60,.10); border:2px solid rgba(224,145,60,.40);
    display:flex; align-items:center; justify-content:center;
    color:#e0913c; font-size:26px; line-height:1;
  }
  .btn.held { background:rgba(224,145,60,.30); }
  #bJump  { right:calc(env(safe-area-inset-right,0px) + 18px); width:96px; font-size:15px; letter-spacing:.08em; }

  /* THE D-PAD: four arms round a hub, bottom left, on a 66px grid. UP is
     jump, the same as ArrowUp on a keyboard. It is ONE element as far as the
     touch test is concerned - see hitTest() - which is what lets a corner
     hold two directions at once. */
  #dpad {
    position:fixed; left:calc(env(safe-area-inset-left,0px) + 16px);
    bottom:calc(env(safe-area-inset-bottom,0px) + 20px);
    width:198px; height:198px;
  }
  /* Sideways there are 393px of height for the whole game, so the cross gives
     some back. hitTest() reads getBoundingClientRect(), which carries the
     transform, so nothing else needs to know it shrank. */
  @media (orientation: landscape) { #dpad { transform:scale(.72); transform-origin:bottom left; } }
  .arm, #dHub {
    position:absolute; width:66px; height:66px; box-sizing:border-box;
    background:rgba(224,145,60,.10); border:2px solid rgba(224,145,60,.40);
    display:flex; align-items:center; justify-content:center;
    color:#e0913c; font-size:22px; line-height:1;
  }
  .arm.held { background:rgba(224,145,60,.30); }
  /* Every arm drops the border facing the hub and the hub has none at all, so
     the five boxes outline one plus instead of five squares. */
  #bUp    { left:66px;  top:0;     border-radius:14px 14px 0 0; border-bottom:0; }
  #bLeft  { left:0;     top:66px;  border-radius:14px 0 0 14px; border-right:0; }
  #bRight { left:132px; top:66px;  border-radius:0 14px 14px 0; border-left:0; }
  #bDown  { left:66px;  top:132px; border-radius:0 0 14px 14px; border-top:0; }
  #dHub   { left:66px;  top:66px;  border:0; }

  .sheet {
    position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:10px;
    background:rgba(26,29,32,.90); text-align:center; padding:20px;
  }
  .sheet.gone { display:none; }
  .sheet h1 { margin:0; font-size:36px; font-weight:600; letter-spacing:.16em; color:#e0913c; }
  .sheet p  { margin:0; font-size:13px; color:#9aa0a6; max-width:280px; line-height:1.6; }

  /* The title card, art/title.jpg, shown WHOLE - contain, never cover. Its
     lettering runs within 40px of both sides of an 832px-wide picture, and cover
     on a 375x812 phone crops 128 source px off each side, "Storage Sprint"
     with them. What contain leaves empty is the same picture again, blurred and
     darkened, so the card sits in its own light rather than in a letterbox.
     Until the picture has loaded - or if it never does - the splash is the
     text title it always was; #splash.art is set only once it is there. */
  /* The splash holds back the same strip everything else does. The card is a
     CENTRED COLUMN, so it climbs as the screen gets shorter, and the mute button
     is over it before it runs out of room: at 375x548 the card's top was 30 and
     the button 52..83, straight through SLUMPD'S. That is the same failure the
     104px reserve below was added to fix, reopened by moving the button down -
     the reserve sizes the COLUMN and does nothing about what is over it, so the
     allowance belongs on the container. box-sizing so max-height:100% below
     still means the content box. */
  #splash { background:#17171b; overflow:hidden; isolation:isolate;
            box-sizing:border-box;
            padding-top:max(96px, calc(env(safe-area-inset-top,0px) + 84px)); }
  @media (orientation: landscape) {
    #splash { padding-top:max(60px, calc(env(safe-area-inset-top,0px) + 56px)); }
  }
  #splash::before {
    content:''; position:absolute; inset:-40px; z-index:-1;
    background:url('art/title.jpg') center / cover no-repeat;
    filter:blur(18px) brightness(.4);
  }
  /* The height held back is everything under the card: the prompt, and the
     tagline while it shows. Holding back only the prompt's 64px overran the
     column by 39px wherever the card is limited by height with the tagline on
     - a 375x548 SE in Safari - and centring split that into the top padding,
     which put the card's title under the mute button. */
  #titleArt { display:none; max-width:100%; max-height:calc(100% - 104px); object-fit:contain;
              border-radius:4px; box-shadow:0 12px 40px rgba(0,0,0,.7); }
  #splash.art #titleArt { display:block; }
  #splash.art h1 { display:none; }
  /* A landscape phone has 375px of height for all of it: the card, then only
     the prompt. */
  @media (max-height:520px) {
    #splash.art .tagline { display:none; }
    #titleArt { max-height:calc(100% - 64px); }
  }

  /* UNDER THE NOTCH otherwise. The page runs edge to edge - viewport-fit=cover
     with a black-translucent status bar - so a flat 6px from the top is 6px
     INTO the status bar on any phone with an inset, and the button came back
     from one reported as cut off. #hud allowed for the inset from the start;
     this never did. */
  #mute {
    position:fixed; top:calc(env(safe-area-inset-top,0px) + 20px);
    right:calc(env(safe-area-inset-right,0px) + 8px); z-index:120;
    font:600 11px/1 ui-monospace,Menlo,Consolas,monospace; letter-spacing:.08em;
    color:#878d93; background:rgba(23,23,27,.82); border:1px solid #3a3f45;
    border-radius:4px; padding:9px 11px; cursor:pointer; user-select:none;
    -webkit-tap-highlight-color:transparent; touch-action:manipulation;
  }
  /* AFTER #mute, not inside the portrait block up with #hud: same
     specificity, and the later rule wins. Written up there it measured as
     having no effect at all - the button stayed on the row it was already
     on while the HUD moved down without it. */
  @media (orientation: portrait) {
    #mute { top:max(52px, calc(env(safe-area-inset-top,0px) + 40px)); }
  }
  #mute:active { color:#e0913c; }

  /* Creeps down from the top on pickup, showing the full-size card from
     art/cards_menu.png - same 500%/25% sprite-sheet trick as the score sheet. */
  /* THE CARD BANNER LANDS BELOW THE TOP STRIP, not on top of it. At top:0 it
     was drawn under the clock and the battery in a standalone home-screen app
     - the page runs edge to edge (viewport-fit=cover), so top:0 is the top of
     the SCREEN, not the top of anything the player owns - and it covered the
     status line and the mute button on the way past. Same max(floor, inset +
     gap) the stage's padding-top uses, so it arrives exactly where the game
     does.
     And it fades in over a SHORT slide rather than sliding its whole height:
     translateY(-115%) starts it a full banner above wherever it is anchored,
     which is back over the status bar again for the half second it travels. */
  #cardBanner {
    position:fixed; left:0; right:0; z-index:100;
    top:max(96px, calc(env(safe-area-inset-top,0px) + 84px));
    display:flex; align-items:center; gap:14px; padding:10px 16px;
    background:linear-gradient(180deg,rgba(23,23,27,.97),rgba(23,23,27,.80));
    border-bottom:2px solid #e0913c; pointer-events:none;
    transform:translateY(-16px); opacity:0;
    transition:transform .5s cubic-bezier(.2,.9,.3,1), opacity .3s;
  }
  /* Landscape has 393px of height for everything, so the banner keeps the
     tight offset the stage keeps there. */
  @media (orientation: landscape) {
    #cardBanner { top:calc(env(safe-area-inset-top,0px) + 28px); }
  }
  #cardBanner.in { transform:translateY(0); opacity:1; }
  /* The torch card's own moment. The whole game - clock included - holds still
     underneath for TC.pause seconds. art/torch-splash.png is the D.T.C. card at
     full size; without it the fallback shows the same card's cell out of
     cards_menu.png, which is the last one on the sheet. */
  #torchSplash {
    position:fixed; inset:0; z-index:150; pointer-events:none;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
    background:radial-gradient(ellipse at center, rgba(52,18,6,.62), rgba(8,8,10,.86));
    opacity:0; transition:opacity .16s;
  }
  #torchSplash.in { opacity:1; }
  #torchSplash > * { transform:scale(.55); transition:transform .38s cubic-bezier(.2,1.6,.4,1); }
  #torchSplash.in > * { transform:scale(1); }
  #tsImg { display:none; max-width:88vw; max-height:78vh; object-fit:contain; image-rendering:pixelated; }
  #torchSplash.custom #tsImg { display:block; }
  #torchSplash.custom #tsCard, #torchSplash.custom #tsText { display:none; }
  /* Every element that shows one cell of art/cards_menu.png gets its
     background-size and -position from paintCard() in JS, never from here:
     both depend on how many cards are on the sheet, and when it grew from five
     to six this rule kept its 500% and quietly showed each card with a sliver
     of both neighbours. */
  #tsCard {
    width:min(50vw, 250px); aspect-ratio:49/73; border-radius:6px;
    background-image:url('art/cards_menu.png');
    background-repeat:no-repeat; image-rendering:pixelated;
    box-shadow:0 0 44px rgba(242,162,60,.6);
  }
  #tsText {
    font:900 26px/1 ui-monospace, Menlo, monospace; letter-spacing:.14em; color:#f2c744;
    text-shadow:0 2px 0 #7a2019, 0 0 18px rgba(242,162,60,.85);
  }
  #cbArt {
    width:78px; height:116px; flex:none; border-radius:3px;
    background-image:url('art/cards_menu.png');
    background-repeat:no-repeat; image-rendering:pixelated;
  }
  #cbText { display:flex; flex-direction:column; gap:4px;
            font-family:ui-monospace,Menlo,Consolas,monospace; }
  #cbKicker { font-size:10px; letter-spacing:.16em; color:#878d93; }
  #cbName   { font-size:21px; letter-spacing:.05em; color:#e8e2d6; }
  #cbGot    { font-size:10px; letter-spacing:.16em; color:#e0913c; }

  /* The run so far, under the name: one cell per card, dim for the ones still
     out there, lit for the ones you have, ringed for the one that just landed.
     The same sheet the score sheet uses, at a third the size, so the banner
     answers "what did I just get" and "what have I got" in one look. It sits
     inside #cbText because the column is shorter than #cbArt is tall - the
     strip costs no banner height at all. */
  #cbRun { display:flex; gap:3px; margin-top:3px; }
  .cbMini {
    width:32px; aspect-ratio:49/73; border-radius:2px;
    background-image:url('art/cards_menu.png');
    background-repeat:no-repeat; image-rendering:pixelated;
    filter:brightness(.22) grayscale(1); opacity:.6;
    transition:filter .45s ease, opacity .45s ease, transform .45s cubic-bezier(.2,1.4,.4,1);
  }
  .cbMini.got { filter:none; opacity:1; }
  .cbMini.new { transform:translateY(-3px);
                box-shadow:0 0 0 2px #e0913c, 0 0 14px rgba(224,145,60,.75); }

  @media (max-width:560px) {
    #cbArt { width:56px; height:83px; }
    #cbName { font-size:16px; }
    .cbMini { width:24px; }
  }

  /* The six collectible cards, revealed as the cards row tallies. Each slot
     shows one 196x292 cell of art/cards_menu.png, cropped by paintCard(). The
     last one is the torch card. */
  /* width:100%, not shrink-to-fit: the slots size themselves off this row, so
     leaving its width to depend on them in turn resolves to nothing and the
     shelf collapses. */
  #cardShelf {
    display:flex; flex-wrap:wrap; gap:6px;
    justify-content:center; margin:10px 0 4px; width:100%; max-width:100%;
  }
  /* Six across, always one row. #score's own 20px padding leaves 335px on a
     375pt phone and 6x62 + five 6px gaps wanted 402, so this asks for 84 and
     takes whatever a sixth of the row actually is - which also stops a 320pt
     phone wrapping the set into 3 + 3. */
  .cardSlot {
    width:min(84px, calc((100% - 30px) / 6)); aspect-ratio:49/73;
    background-image:url('art/cards_menu.png');
    background-repeat:no-repeat;
    image-rendering:pixelated;
    border-radius:3px;
    filter:brightness(.16) grayscale(1);    /* not collected */
    opacity:.5; transform:translateY(6px) scale(.94);
    transition:filter .45s ease, opacity .45s ease, transform .45s cubic-bezier(.2,1.4,.4,1);
  }
  .cardSlot.got { filter:none; opacity:1; transform:none; }
  #splash h1, #splash p { text-shadow:0 3px 0 rgba(0,0,0,.9); }
  /* The text title, for when art/title.jpg is missing. 8vw keeps "STORAGE
     SPRINT", the longer line, inside a 375px phone's 335px column. */
  #splash h1 { font-size:min(36px, 8vw); line-height:1.15; }

  /* .45, not .62: the boxes now load into the truck in the wall art behind
     this, and at .62 the bay was too dark to read them going in. */
  #score { background:rgba(26,29,32,.45); justify-content:flex-end; padding-bottom:14vh; gap:6px; }
  #score .row {
    display:flex; justify-content:space-between; width:250px;
    font-size:14px; color:#e8e2d6; opacity:0; transition:opacity .25s;
  }
  #score .row.in { opacity:1; }
  #score .row span:last-child { color:#e0913c; }
  #score .total { border-top:2px solid #4a5056; padding-top:8px; margin-top:6px; font-size:18px; }
  #grade { font-size:64px; font-weight:700; letter-spacing:.06em; color:#e0913c; margin:4px 0 0; opacity:0; transition:opacity .4s; }
  #grade.in { opacity:1; }
  /* A run that ended under Grimace does not get a score. Nothing was
     delivered, so there is nothing to count: the sheet is GAME OVER and the
     button, and the rows and the card shelf are not drawn at all. */
  #grade.over { font-size:44px; color:#b8362a; letter-spacing:.12em; }
  #score.over .row, #score.over #cardShelf { display:none; }
  #score.over { justify-content:center; padding-bottom:20px; }
  /* The clip that plays over GAME OVER, if art/loser.mp4 (or .webm) is there.
     See-through, behind the text, and it never takes a tap. */
  /* Hidden by OPACITY, never display:none: a phone will not start a video it
     is not laying out, and this one is started by the game rather than by a
     tap. */
  #loserClip {
    position:absolute; inset:0; width:100%; height:100%; object-fit:contain;
    opacity:0; filter:brightness(.85); pointer-events:none; transition:opacity .2s;
  }
  #score.over.clip #loserClip { opacity:.3; }
  /* The words have to win over whatever is playing behind them: at .45 with no
     shadow the clip's bright middle swallowed both of them. */
  #score.over #grade { text-shadow:0 2px 10px rgba(0,0,0,.95), 0 0 3px rgba(0,0,0,.9); }
  #score.over #again { background:rgba(18,20,23,.78); text-shadow:0 1px 4px rgba(0,0,0,.9); }
  #again {
    margin-top:14px; padding:12px 26px; border-radius:12px;
    border:2px solid #e0913c; color:#e0913c; background:transparent;
    font:inherit; font-size:14px; letter-spacing:.08em; opacity:0; transition:opacity .3s;
  }
  #again.in { opacity:1; }
</style>
</head>
<body>

<div id="stage"><canvas id="game"></canvas></div>
<div id="hud"></div>
<div id="mute">🔈 TAP FOR SOUND</div>

<div id="cardBanner">
  <div id="cbArt"></div>
  <div id="cbText">
    <span id="cbKicker"></span>
    <b id="cbName"></b>
    <span id="cbGot">CARD COLLECTED</span>
    <div id="cbRun">
      <div class="cbMini" id="cbMini0"></div><div class="cbMini" id="cbMini1"></div>
      <div class="cbMini" id="cbMini2"></div><div class="cbMini" id="cbMini3"></div>
      <div class="cbMini" id="cbMini4"></div><div class="cbMini" id="cbMini5"></div>
    </div>
  </div>
</div>

<div id="torchSplash">
  <img id="tsImg" alt="">
  <div id="tsCard"></div>
  <b id="tsText">TORCH CARD!</b>
</div>

<div id="safe"></div>

<div id="pad">
  <div id="dpad">
    <div class="arm" id="bUp">&#9650;</div>
    <div class="arm" id="bLeft">&#9664;</div>
    <div id="dHub"></div>
    <div class="arm" id="bRight">&#9654;</div>
    <div class="arm" id="bDown">&#9660;</div>
  </div>
  <div class="btn" id="bJump">JUMP</div>
</div>

<div class="sheet" id="splash">
  <img id="titleArt" src="art/title.jpg" alt="Slumpd's Storage Sprint" draggable="false">
  <h1>SLUMPD'S<br>STORAGE SPRINT</h1>
  <p class="tagline">Clear the unit. Grab every box and card. Something in the back is awake.</p>
  <p style="color:#e0913c">tap to start</p>
</div>

<div class="sheet gone" id="score">
  <video id="loserClip" playsinline muted preload="auto"></video>
  <div class="row" id="rBox"><span>boxes</span><span></span></div>
  <div class="row" id="rCard"><span>cards</span><span></span></div>
  <div id="cardShelf">
    <div class="cardSlot" id="cardSlot0"></div><div class="cardSlot" id="cardSlot1"></div>
    <div class="cardSlot" id="cardSlot2"></div><div class="cardSlot" id="cardSlot3"></div>
    <div class="cardSlot" id="cardSlot4"></div><div class="cardSlot" id="cardSlot5"></div>
  </div>
  <div class="row" id="rTime"><span>time bonus</span><span></span></div>
  <div class="row" id="rClean"><span>no-hit bonus</span><span></span></div>
  <div class="row total" id="rTotal"><span>TOTAL</span><span></span></div>
  <div id="grade">—</div>
  <button id="again">RUN IT BACK</button>
</div>

<script>
'use strict';

/* ==========================================================================
   1. TUNING — the whole feel of the game lives in these numbers
   ========================================================================== */
const TILE   = 24;
// WORLD UNITS ACROSS: this fixes the zoom, and so the character's on-screen
// size - he is 57 * (screenWidth / VIEW_W) * S CSS pixels tall, and VIEW_W is
// the only term in that a phone can do anything about. So a phone held tall
// gets a NARROWER one and everything else keeps 384. On a 393x852 phone 320 is
// 70 CSS pixels of character against 58.
//
// WHY 320 AND NOT LESS. The chase runs on the daylight between the player and
// the spider, which is (VIEW_W/2 - 10) - (SPIDER_EDGE + 64) because the camera
// centres one and SPIDER_EDGE pins the other. Below about 70 units of it the
// chase stops working - the note on SPIDER_EDGE has the numbers - and 320 is
// exactly 70. 288 was tried and it is 54, which needed the spider pinned
// OUTSIDE the left edge to make up, and a quarter of it off the screen is not
// worth 8 pixels of character.
// resize() picks it and rebuilds the two things derived from it: the canvas,
// and BG_OPEN_X.
const VIEW_W_WIDE = 384, VIEW_W_PHONE = 320;
let   VIEW_W = VIEW_W_WIDE;
let   VIEW_H = 216;                    // recomputed from the real viewport in resize()
const STEP   = 1 / 60;

// ---- RENDER SCALE -------------------------------------------------------
// The one dial for art fidelity. The world stays 384x216 units at every
// setting, so physics, level design, camera and collision are untouched.
// S only decides how many real pixels each world unit gets — and therefore
// how much detail a sprite is allowed to carry.
//   S=1  ->  384 x 216 canvas,  32 x 48 player art   (chunky, cheapest)
//   S=2  ->  768 x 432 canvas,  64 x 96 player art
//   S=3  -> 1152 x 648 canvas,  96 x 144 player art  (~1:1 with iPhone pixels)
// Placeholder art looks identical at every S. Only real PNGs get sharper.
const S = 3;

// ---- CHARACTER SIZE -----------------------------------------------------
// How big the protagonist is in world units, relative to the first build.
// 1.0 = original.  1.5 = roughly 70-75% of the reference image's character.
// This is NOT free: past ~1.4 the player no longer fits under a thin shelf
// with only two rows of clearance, which is why the level maps below use
// solid box stacks for low ground and reserve thin shelves for rows 5 and 3.
// Change this and re-run audit.js before trusting the level.
const HERO = 1.5;

const GRAVITY   = 1400;
const MAX_RUN   = 160;
const ACCEL     = 1100;
const AIR_ACCEL = 800;
const FRICTION  = 1400;
const JUMP_V    = -480;   // apex ~82px => clears 3 tiles up, ~4.5 tiles across
const JUMP_CUT  = -140;
const MAX_FALL  = 620;
const COYOTE    = 0.12;
const BUFFER    = 0.14;
const DROP_T    = 0.15;   // s that shelves are ignored after pressing down on one:
                          // ~16 units of fall, past a 10-unit shelf. Counted down
                          // inside moveAndCollide, so no caller can forget to.

const INVULN    = 1.2;
const PAR_TIME  = 150;    // seconds; finishing under this earns time bonus

// TIME IS A TIEBREAKER, NOT A STRATEGY. At 20 a second against a 150s par it
// was the biggest single term in the game and it paid for NOT playing: the
// fastest way through a storage unit is to leave the boxes in it. 6 a second
// makes a brisk run worth a few hundred and a slow one worth nothing, which
// is the weight a tiebreaker should have. Cards came down for the same
// reason - five of the six sit on the route, so they were 3750 points of
// walking - and the box, the thing the game is actually about, went up.
// The no-hit bonus came DOWN, which reads backwards until you see what the
// grade does: a hit already costs a letter, so paying 1500 for it here as
// well put a clean rushed run above a thorough one that got clipped once -
// measured, 9510 against 8500. The letter punishes the hit; the score is
// only the tally, and at 800 it orders the way the letter does.
const SCORE = { box: 200, card: 400, stomp: 50, perSecond: 6, clean: 800 };

// THE GRADE IS WHAT YOU DID, NOT WHAT YOU SCORED. It used to be a points
// table - S at 7750 - and sim.js's BOT TOOK S ON 41 OF 41 LAYOUTS with a mean
// of 9952. That bot runs right, never detours, and collects only what is in
// its way: 31 of 42 boxes and 5 of 6 cards, in 37.7s. Under the old table
// that was 3100 + 3750 + 2246 of time + 1000 for being clean, and the best
// score in the game belonged to the run that did the least.
// No points total fixes that on its own, because three quarters of the boxes
// ARE on the route - only the last quarter costs anything, and a linear score
// cannot tell 74% from 100% by enough. So the letter is a requirement now and
// the score is just the number beside it. Fractions, not counts, so a change
// to how many boxes a layout carries does not quietly move the bar.
const GRADES = [
  { letter:'S', boxes:1.00, cards:1.00, hits:0  },   // every box, every card, untouched
  { letter:'A', boxes:0.90, cards:0.83, hits:1  },   // 38 of 42, 5 of 6, one hit
  { letter:'B', boxes:0.70, cards:0,    hits:99 },   // 30 of 42
  { letter:'C', boxes:0,    cards:0,    hits:99 }
];

/* ==========================================================================
   2. PALETTE — sampled off the reference image
   ========================================================================== */
const C = {
  doorMid:'#c2551f', doorHi:'#e0913c', doorLo:'#8c3a10',
  // wall must equal WALL in tools/make_bg.py: the door tiles' tops fade to it
  // and the upper tile blends into it, and it fills the view behind both.
  floor:'#5f6469',  floorHi:'#6f757a', wall:'#6c747c', wallHi:'#9aa0a6',
  trim:'#2c5c86',   ceil:'#3a3f45',    deep:'#23272b',
  card1:'#b58f57',  card2:'#d0ac74',   card3:'#7d6238',
  wood:'#8a6a3d',   woodHi:'#a88352',  cardDeep:'#3e3119',
  ink:'#17171b',    skin:'#d2a07c',    cargo:'#6b675c',
  red:'#b8362a',    hot:'#d94f3d',     lamp:'#eef3f7',
  spider:'#2b2027', spiderHi:'#5c3f4a',
  gold:'#e0913c',   paper:'#e8e2d6'
};

/* ==========================================================================
   3. LEVEL — 9 rows tall, 24px tiles, four 48-tile acts.
      Legend:  # boxes/solid   = pallet shelf (one-way)   b box   c card
               r rat  o roach  P spawn  S spider trigger  T torch card  E exit
      These strings are the CLASSIC level now: the fallback, and the rulebook the
      generator in 3b reads its anchors and counts from. Every playthrough is
      generated unless the URL says ?seed=classic.
   ========================================================================== */
const ACT_A = [
  '................................................',
  '................................................',
  '................................................',
  '................................................',
  '................................................',
  '................................................',
  '..................bb............................',
  '..................===...........................',
  '................................................',
  '.........bb.....................................',
  '.........===..===.........bbb.........c.........',
  '..........................###...................',
  '..P...b......b.....###..b.###.....b.....r.......',
  '################################################'
];
const ACT_B = [
  '................................................',
  '................................................',
  '................................................',
  '................................................',
  '................................................',
  '................................................',
  '................................................',
  '................................................',
  '................................................',
  '...bb...................................bb......',
  '...===............c.......bbb...........====....',
  '..............b...........####..................',
  '...b........o###...b......####...b.......o...b..',
  '#########..###########..############..##########'
];
const ACT_C = [
  '................................................',
  '................................................',
  '................................................',
  '................................................',
  '..............................cbb...............',
  '.............................====...............',
  '................................................',
  '.........................bb.....................',
  '........................====....................',
  '..........bbc.....bbb...........................',
  '.........====....#####..........................',
  '.................#####..........................',
  '..........o...b..#####....b.........o...b...S...',
  '######..#######################..###############'
];
const ACT_D = [
  '................................................',
  '................................................',
  '................................................',
  '................................................',
  '................................................',
  '................................................',
  '................................................',
  '................................................',
  '................................................',
  '................................................',   // the card and its boxes moved to the floor:
  '................................................',   // no shelf past the spider trigger any more
  '......b.............b...........................',
  '...b..##.......b....##........T..cbb..b.....E...',
  '##########..############..######################'
];
// The hand-built level. It has two jobs now. It is the RULEBOOK the generator
// reads - which columns hold the spawn, the spider trigger, the torch card and
// the exit, where the cards go, how many boxes and which enemies each act gets -
// and it is the FALLBACK, played with ?seed=classic, or whenever the generator
// cannot produce a layout its own route checker will accept.
const CLASSIC = [ACT_A, ACT_B, ACT_C, ACT_D];

const ROWS = 14;   // 5 rows of upper warehouse above the 9-row playfield
const COLS = CLASSIC.length * 48;
const LEVEL_W = COLS * TILE;
const LEVEL_H = ROWS * TILE;
const GROUND_Y = LEVEL_H - TILE;   // top of the floor row

// All of this is rebuilt for every layout, IN PLACE: the arrays are emptied and
// refilled, never replaced, because the rest of the file holds on to them.
const solids = [];      // merged collision rects
const tiles  = [];      // per-tile render info
// Every run of floor row that is NOT floor: where the concrete stops and the
// dark starts. render() shades these, and nothing else needs them.
const pits   = [];
// One per = shelf: its span, and where each end's legs come down - the top of
// the first solid under that end's column, a box stack, the floor or another
// shelf, or past the bottom of the level over a pit. Lowest shelves first, so a
// rack standing on another is drawn over the deck its feet are on.
const racks  = [];
let spawn = { x: 48, y: 100 };
let chaseTriggerX = LEVEL_W, exitX = LEVEL_W - 96;
let TRUCK_X = 0;                     // world x of the truck's left edge, set from exitX
const boxSpots = [], cardSpots = [], enemySpots = [];
let TOTAL_BOXES = 0, TOTAL_CARDS = 0;
let levelSeed = 'classic';           // what built the current layout; ?seed= rebuilds it

function isSolidCh(ch) { return ch === '#' || ch === '='; }

function classicGrid() {
  const grid = [];
  for (let r = 0; r < ROWS; r++) {
    let line = '';
    for (let a = 0; a < CLASSIC.length; a++) line += CLASSIC[a][r];
    grid.push(line);
  }
  return grid;
}

// grid: ROWS rows of COLS characters, as strings or arrays.
function parseLevel(grid) {
  solids.length = 0; tiles.length = 0; racks.length = 0; pits.length = 0;
  boxSpots.length = 0; cardSpots.length = 0; enemySpots.length = 0;
  const under = function (r, c) {             // top of the first solid below (r, c)
    for (let rr = r + 1; rr < ROWS; rr++) if (isSolidCh(grid[rr][c])) return rr * TILE;
    return LEVEL_H + 12;                      // a pit: feet out of sight below it
  };
  // Which sides of a box tile touch another box tile. render() needs it: the
  // gaps a box tile leaves are filled with shadow only on those sides, or the
  // outside of a stack reads as boxes painted on a dark rectangle.
  const box = function (rr, cc) {
    return rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS && grid[rr][cc] === '#';
  };
  for (let r = 0; r < ROWS; r++) {
    let runChar = null, runStart = 0;
    for (let c = 0; c <= COLS; c++) {
      const ch = c < COLS ? grid[r][c] : null;
      const solidChar = (ch === '#' || ch === '=') ? ch : null;

      if (solidChar !== runChar) {
        if (runChar) {
          solids.push({
            x: runStart * TILE, y: r * TILE,
            w: (c - runStart) * TILE,
            h: runChar === '#' ? TILE : 10,
            oneWay: runChar === '='            // see moveAndCollide
          });
          if (runChar === '=') racks.push({ x: runStart * TILE, y: r * TILE, w: (c - runStart) * TILE,
                                            footL: under(r, runStart), footR: under(r, c - 1) });
        }
        runChar = solidChar; runStart = c;
      }
      if (ch === '#' || ch === '=') {
        tiles.push({ x: c * TILE, y: r * TILE, t: ch,
                     nL: box(r, c - 1), nR: box(r, c + 1),
                     nU: box(r - 1, c), nD: box(r + 1, c) });
      }

      const cx = c * TILE + TILE / 2, cy = r * TILE + TILE / 2;
      if (ch === 'P') spawn = { x: c * TILE + 3, y: (r + 1) * TILE - Math.round(38 * HERO) };
      else if (ch === 'b') boxSpots.push({ x: cx, y: cy });
      else if (ch === 'c') cardSpots.push({ x: cx, y: cy, torch: false });
      else if (ch === 'T') cardSpots.push({ x: cx, y: cy, torch: true });
      else if (ch === 'r') enemySpots.push({ x: c * TILE, y: (r + 1) * TILE, kind: 'rat' });
      else if (ch === 'o') enemySpots.push({ x: c * TILE, y: (r + 1) * TILE, kind: 'roach' });
      else if (ch === 'S') chaseTriggerX = c * TILE;
      else if (ch === 'E') exitX = c * TILE;
    }
  }
  for (let c = 0; c < COLS; c++) {                 // the pits, as runs of columns
    if (isSolidCh(grid[ROWS - 1][c])) continue;
    let e = c;
    while (e + 1 < COLS && !isSolidCh(grid[ROWS - 1][e + 1])) e++;
    pits.push({ x: c * TILE, w: (e - c + 1) * TILE });
    c = e;
  }
  racks.sort(function (a, b) { return b.y - a.y; });
  TOTAL_BOXES = boxSpots.length;
  TOTAL_CARDS = cardSpots.length;
  TRUCK_X = exitX + 8;                // just past the exit, so its open rear shows
}

/* ==========================================================================
   3b. GENERATED LEVELS
      Every playthrough gets its own platforms, boxes and enemies, built from a
      numbered seed - ?seed=N rebuilds that exact layout, ?seed=classic plays
      the hand-built one, and ?fps shows which seed is on screen.

      THE ROUTE CHECKER IS THE POINT. A layout is only kept if checkRoutes()
      proves the exit can be reached and that NO reachable place is a dead end
      (outside the chase a fall respawns you where you last stood, so a perch
      whose only way off is a pit would trap you). It does not estimate
      reach from the jump budget - it runs the player's own movement: the same
      acceleration, friction, gravity, jump and axis-by-axis collision as
      updatePlayer and moveAndCollide, one-way shelves and dropping through them
      included.
      It is deliberately conservative - jumps start only from tile centres, no
      coyote time - so it can reject a fine layout but cannot pass a bad one.
      Pickups go only on tiles it proved can be touched.

      The rules the terrain follows are the ones written down for the level:
      gaps of two at most, stacks of three at most and two in the chase, a
      shelf only with three clear rows under it and three over it, and flat
      open ground at the spawn, the spider trigger, the torch card and the exit.
   ========================================================================== */
const SEED_PARAM = (function () {
  const m = /[?&]seed=([^&]+)/.exec(location.search);
  if (!m) return null;
  return m[1] === 'classic' ? 'classic' : (parseInt(m[1], 10) >>> 0);
})();

function mulberry32(a) {
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// What the generator must reproduce, read off the classic strings - so editing
// those strings still decides the anchors and the counts.
const PLAN = (function () {
  const g = classicGrid();
  const plan = { P: 0, S: 0, T: 0, E: 0, cards: [], boxes: [0, 0, 0, 0], enemies: [[], [], [], []] };
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const ch = g[r][c], act = Math.floor(c / 48);
    if (ch === 'P') plan.P = c;
    else if (ch === 'S') plan.S = c;
    else if (ch === 'T') plan.T = c;
    else if (ch === 'E') plan.E = c;
    else if (ch === 'c') plan.cards.push({ col: c, perch: (r + 1 < ROWS - 1 && isSolidCh(g[r + 1][c])) ? r + 1 : null });
    else if (ch === 'b') plan.boxes[act]++;
    else if (ch === 'r' || ch === 'o') plan.enemies[act].push({ col: c, ch: ch });
  }
  plan.enemies = plan.enemies.map(function (l) {
    return l.sort(function (x, y) { return x.col - y.col; }).map(function (e) { return e.ch; });
  });
  return plan;
})();

const PW = Math.round(13 * HERO), PH = Math.round(38 * HERO);   // the player's box, as `player` below

function pickWeighted(list, weight, rand) {
  let sum = 0;
  for (let i = 0; i < list.length; i++) sum += weight(list[i]);
  let x = rand() * sum;
  for (let i = 0; i < list.length; i++) { x -= weight(list[i]); if (x <= 0) return list[i]; }
  return list[list.length - 1];
}

// --- terrain ------------------------------------------------------------------
function carveTerrain(g, rand) {
  const RI = function (lo, hi) { return lo + Math.floor(rand() * (hi - lo + 1)); };
  // flat: no pits and no stacks. open: nothing at all in the playfield.
  const flat = new Uint8Array(COLS), open = new Uint8Array(COLS);
  const mark = function (arr, lo, hi) { for (let c = Math.max(0, lo); c <= Math.min(COLS - 1, hi); c++) arr[c] = 1; };
  mark(flat, 0, PLAN.P + 6);  mark(open, 0, PLAN.P + 3);
  mark(flat, PLAN.S - 2, PLAN.S + 2);
  mark(flat, PLAN.T - 12, PLAN.T + 8);    // the cutscene runs, burns and shakes hands along this floor
  mark(flat, PLAN.E - 5, COLS - 1); mark(open, PLAN.E - 5, COLS - 1);

  const clearBox = function (r0, r1, c0, c1) {
    for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
      if (r < 0 || r >= ROWS || c < 0 || c >= COLS || g[r][c] !== '.') return false;
    }
    return true;
  };

  // pits: two wide at most, never within six columns of another
  for (let act = 0; act < CLASSIC.length; act++) {
    const want = act === 0 ? RI(0, 1) : RI(2, 3);
    for (let tries = 0, got = 0; got < want && tries < 60; tries++) {
      const w = rand() < 0.75 ? 2 : 1, c = act * 48 + RI(2, 45 - w);
      let ok = true;
      for (let k = c - 6; k < c + w + 6; k++) if (k < 0 || k >= COLS || flat[k] || g[ROWS - 1][k] !== '#') ok = false;
      if (!ok) continue;
      for (let k = c; k < c + w; k++) g[ROWS - 1][k] = '.';
      got++;
    }
  }

  // box stacks: 2-5 wide, 1-3 tall (2 in the chase), sometimes a second tier
  for (let act = 0; act < CLASSIC.length; act++) {
    const want = RI(2, 4);
    for (let tries = 0, got = 0; got < want && tries < 80; tries++) {
      const w = RI(2, 5), c = act * 48 + RI(1, 46 - w);
      const chase = c + w > PLAN.S - 3;
      let h = RI(1, 3);
      if (chase) h = Math.min(h, 2);
      let ok = true;
      for (let k = c - 2; k <= c + w + 1; k++) if (k < 0 || k >= COLS || flat[k] || g[ROWS - 1][k] !== '#') ok = false;
      // the stack, a column either side, and three rows of standing room on top
      if (!ok || !clearBox(ROWS - 1 - h - 3, ROWS - 2, c - 1, c + w)) continue;
      for (let r = ROWS - 1 - h; r <= ROWS - 2; r++) for (let k = c; k < c + w; k++) g[r][k] = '#';
      if (h < 3 && w >= 4 && !(chase && h + 1 > 2) && rand() < 0.35) {
        const r = ROWS - 2 - h;
        if (clearBox(r - 3, r, c, c + w - 1)) for (let k = c + 1; k < c + w - 1; k++) g[r][k] = '#';
      }
      got++;
    }
  }

  // A shelf needs the nearest solid under it at least three rows down in every
  // column it spans and one either side - 62 units of clearance for a 57-unit
  // player - and three clear rows on top of it to stand in.
  const shelfFits = function (r, c, w) {
    if (r < 3 || c < 1 || c + w >= COLS) return false;
    // NOTHING TO CLIMB ONCE THE SPIDER IS UP. Past the trigger the only high
    // ground is box stacks, so the only way over the spider starts on one -
    // which is the point: getting behind it has to be a decision, and a stack
    // is 24 units of head start on a jump that otherwise cannot clear it.
    if (c + w - 1 >= PLAN.S) return false;
    for (let k = c - 1; k <= c + w; k++) {
      if (open[k]) return false;
      for (let rr = r - 3; rr <= r; rr++) if (g[rr][k] !== '.') return false;
      for (let rr = r + 1; rr < ROWS; rr++) {
        if (isSolidCh(g[rr][k])) { if (rr - r < 3) return false; break; }
      }
    }
    // (These two rules predate one-way shelves. Nothing bonks a shelf now, so they
    // are stricter than they need to be; they stay because removing them would
    // change the layout behind a large share of seeds.)
    // A LOW shelf bonks a jump taken beneath it before it gets anywhere. Over
    // the floor, a standing player's head is 5 units under row 10, 29 under row
    // 9 and 53 under row 8 - all short of the 82-unit apex a gap needs - so a
    // jump for a gap under one of these falls into it, every time, from the very
    // edge the player respawns on. sim.js found layouts looping there, a fall
    // every second and a half, that the checker had passed because a harder
    // route over the shelf did exist. Nothing to jump over or up onto within
    // three columns of one. Row 7 leaves 77 units, which clears a gap, so the
    // rule stops there.
    if (r >= ROWS - 6) {
      for (let k = Math.max(0, c - 3); k <= Math.min(COLS - 1, c + w + 2); k++) {
        if (g[ROWS - 1][k] !== '#' || g[ROWS - 2][k] !== '.' || g[ROWS - 3][k] !== '.') return false;
      }
    }
    // And for ANY shelf: if there is a gap within three columns, the jump for
    // that gap must not be cut short by this shelf. Which rows are low enough to
    // do that depends on what is under it, not on the row number - standing on a
    // one-tile stack, row 7 leaves 53 units of rise, exactly what row 8 leaves
    // from the floor, and sim.js was still looping on precisely that. So measure
    // it: the head of whoever stands on the highest surface in the window has to
    // clear the shelf's underside by a full 82-unit apex.
    const lo = Math.max(0, c - 3), hi = Math.min(COLS - 1, c + w + 2);
    let pit = false;
    for (let k = lo; k <= hi; k++) if (g[ROWS - 1][k] !== '#') pit = true;
    if (pit) {
      let top = ROWS - 1;
      for (let k = lo; k <= hi; k++) {
        for (let rr = r + 1; rr < ROWS; rr++) if (isSolidCh(g[rr][k])) { top = Math.min(top, rr); break; }
      }
      if (top * TILE - PH - (r * TILE + 10) < 82) return false;
    }
    return true;
  };
  const putShelf = function (r, c, w) { for (let k = c; k < c + w; k++) g[r][k] = '='; };
  const surfaces = function () {             // [row, c0, c1] runs of tops you could stand on
    const list = [];
    for (let r = 1; r < ROWS - 1; r++) {
      let c = 0;
      while (c < COLS) {
        if (isSolidCh(g[r][c]) && g[r - 1][c] === '.') {
          let e = c;
          while (e + 1 < COLS && isSolidCh(g[r][e + 1]) && g[r - 1][e + 1] === '.') e++;
          list.push([r, c, e]); c = e + 1;
        } else c++;
      }
    }
    return list;
  };
  // one shelf 2-3 rows above something already there, 1-2 columns out from its
  // end, overlapping columns near..rad of `col`
  const climbNear = function (col, rad) {
    const cands = surfaces().filter(function (sf) { return sf[2] >= col - rad - 4 && sf[1] <= col + rad + 4; });
    for (let tries = 0; tries < 40; tries++) {
      const w = RI(3, 5);
      let r, c;
      if (!cands.length || rand() < 0.25) {              // off the floor itself
        r = ROWS - 4; c = col - RI(0, w - 1) + RI(-rad, rad);
      } else {
        const sf = cands[Math.floor(rand() * cands.length)], gap = RI(1, 2);
        r = sf[0] - RI(2, 3);
        c = rand() < 0.5 ? sf[2] + 1 + gap : sf[1] - gap - w;
      }
      if (c + w - 1 < col - rad || c > col + rad) continue;
      if (shelfFits(r, c, w)) { putShelf(r, c, w); return true; }
    }
    return false;
  };

  // low shelves over the floor
  for (let act = 0; act < CLASSIC.length; act++) {
    for (let tries = 0, got = 0, want = RI(1, 3); got < want && tries < 60; tries++) {
      const w = RI(3, 5), c = act * 48 + RI(1, 46 - w);
      if (shelfFits(ROWS - 4, c, w)) { putShelf(ROWS - 4, c, w); got++; }
    }
  }
  // cards the classic level put up on something get something to be up on
  PLAN.cards.forEach(function (card) {
    if (card.perch === null) return;
    const top = function () {
      let best = ROWS - 1;
      surfaces().forEach(function (sf) { if (sf[2] >= card.col - 3 && sf[1] <= card.col + 3) best = Math.min(best, sf[0]); });
      return best;
    };
    for (let i = 0; i < 6 && top() > card.perch; i++) climbNear(card.col, 3);
  });
  // and a climb or two into the upper warehouse, where the classic level had them
  [0, 2].forEach(function (act) {
    if (rand() < 0.3) return;
    const col = act * 48 + RI(12, 36);
    for (let i = 0, n = RI(2, 3); i < n; i++) climbNear(col, 8);
  });
}

// --- the route checker ----------------------------------------------------------
function gridRect(g, r, c) {
  if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return null;
  const ch = g[r][c];
  if (ch === '#') return { x: c * TILE, y: r * TILE, w: TILE, h: TILE };
  if (ch === '=') return { x: c * TILE, y: r * TILE, w: TILE, h: 10, oneWay: true };
  return null;
}
// moveAndCollide, against the character grid instead of merged rects - the same
// one-way rule for shelves, the same dropT, counted down the same way
function gridCollide(g, e, dx, dy) {
  e.x += dx;
  for (let r = Math.floor(e.y / TILE); r <= Math.floor((e.y + e.h) / TILE); r++) {
    for (let c = Math.floor(e.x / TILE); c <= Math.floor((e.x + e.w) / TILE); c++) {
      const s = gridRect(g, r, c);
      if (s && !s.oneWay && hit(e, s)) { if (dx > 0) e.x = s.x - e.w; else if (dx < 0) e.x = s.x + s.w; e.vx = 0; }
    }
  }
  const feetBefore = e.y + e.h;
  e.y += dy;
  e.grounded = false;
  for (let r = Math.floor(e.y / TILE); r <= Math.floor((e.y + e.h) / TILE); r++) {
    for (let c = Math.floor(e.x / TILE); c <= Math.floor((e.x + e.w) / TILE); c++) {
      const s = gridRect(g, r, c);
      if (s && s.oneWay && !landsOn(e, s, feetBefore, dy)) continue;
      if (s && hit(e, s)) {
        if (dy > 0) { e.y = s.y - e.h; e.grounded = true; }
        else if (dy < 0) { e.y = s.y + s.h; }
        e.vy = 0;
      }
    }
  }
  if (e.dropT > 0) e.dropT -= STEP;
}
// updatePlayer, one input held per frame, from a start state. Returns the body
// where it lands, or null for a fall out of the level or no landing in 4 s.
function arc(g, st, dirAt, jump, onStep) {
  const e = { x: st.x, y: st.y, w: PW, h: PH, vx: st.vx, vy: 0, grounded: st.grounded, dropT: st.dropT || 0 };
  for (let i = 0; i < 240; i++) {
    const dir = dirAt(i), acc = e.grounded ? ACCEL : AIR_ACCEL;
    if (dir !== 0) e.vx = clamp(e.vx + dir * acc * STEP, -MAX_RUN, MAX_RUN);
    else if (e.grounded) {
      const drop = FRICTION * STEP;
      e.vx = Math.abs(e.vx) <= drop ? 0 : e.vx - Math.sign(e.vx) * drop;
    }
    if (i === 0 && jump) e.vy = JUMP_V;
    e.vy = Math.min(e.vy + GRAVITY * STEP, MAX_FALL);
    gridCollide(g, e, e.vx * STEP, e.vy * STEP);
    e.x = clamp(e.x, 0, LEVEL_W - e.w);
    if (e.y > LEVEL_H + 80) return null;
    if (onStep) onStep(e);
    if (e.grounded && i > 0) return e;
  }
  return null;
}
// The player standing centred on column c with his feet on row r's top, or
// null if there is nothing there to stand on or no room to stand.
function standAt(g, c, r) {
  if (!gridRect(g, r, c)) return null;
  const e = { x: c * TILE + (TILE - PW) / 2, y: r * TILE - PH, w: PW, h: PH };
  for (let rr = Math.floor(e.y / TILE); rr < r; rr++) {
    const o = gridRect(g, rr, c);
    if (o && !o.oneWay && hit(e, o)) return null;
  }
  return e;
}

function checkRoutes(g) {
  const key = function (c, r) { return r * COLS + c; };
  const nodes = new Map(), out = new Map(), queue = [];
  const box = new Set(), card = new Set();
  const add = function (c, r) {
    const k = key(c, r);
    if (!nodes.has(k)) {
      if (!standAt(g, c, r)) return -1;
      nodes.set(k, { c: c, r: r }); out.set(k, new Set()); queue.push(k);
    }
    return k;
  };
  // every tile a pickup could be touched on, from one body position: the same
  // strict overlap hit() uses, against a box's 28x28 and a card's 28x32
  const touch = function (set, e, hx, hy) {
    const c0 = Math.ceil((e.x - hx - TILE / 2) / TILE), c1 = Math.floor((e.x + e.w + hx - TILE / 2) / TILE);
    const r0 = Math.ceil((e.y - hy - TILE / 2) / TILE), r1 = Math.floor((e.y + e.h + hy - TILE / 2) / TILE);
    for (let r = Math.max(0, r0); r <= Math.min(ROWS - 1, r1); r++) {
      for (let c = Math.max(0, c0); c <= Math.min(COLS - 1, c1); c++) {
        const tx = c * TILE + TILE / 2, ty = r * TILE + TILE / 2;
        if (tx - hx < e.x + e.w && tx + hx > e.x && ty - hy < e.y + e.h && ty + hy > e.y) set.add(key(c, r));
      }
    }
  };
  const sweep = function (e) { touch(box, e, 14, 14); touch(card, e, 14, 16); };
  const land = function (e) {
    const r = Math.round((e.y + e.h) / TILE), mid = Math.floor((e.x + e.w / 2) / TILE);
    const c0 = Math.floor(e.x / TILE), c1 = Math.floor((e.x + e.w - 0.001) / TILE);
    const order = [mid, c0, c1];
    for (let i = 0; i < order.length; i++) if (gridRect(g, r, order[i]) && standAt(g, order[i], r)) return add(order[i], r);
    return -1;
  };
  const JUMPS = [[0, 0], [0, 1], [0, -1], [80, 1], [-80, -1], [MAX_RUN, 1], [-MAX_RUN, -1], [MAX_RUN, 0], [-MAX_RUN, 0]];

  if (add(PLAN.P, ROWS - 1) < 0) return null;
  while (queue.length) {
    const k = queue.shift(), n = nodes.get(k), from = out.get(k);
    const body = standAt(g, n.c, n.r);
    sweep(body);
    const link = function (t) { if (t >= 0 && t !== k) from.add(t); };
    const tryArc = function (st, dirAt, jump) {
      const trail = [];
      const e = arc(g, st, dirAt, jump, function (p) { trail.push({ x: p.x, y: p.y, w: PW, h: PH }); });
      if (e) { trail.forEach(sweep); link(land(e)); }
    };
    for (const d of [-1, 1]) {
      const nc = n.c + d;
      if (nc < 0 || nc >= COLS) continue;
      if (gridRect(g, n.r, nc)) { link(add(nc, n.r)); continue; }
      // off the edge, at a walk and at a run - from just past it, if there is room
      const sx = d > 0 ? nc * TILE + 0.01 : n.c * TILE - PW - 0.01;
      const probe = { x: sx, y: body.y, w: PW, h: PH };
      let blocked = false;
      for (let rr = Math.floor(probe.y / TILE); rr <= n.r - 1; rr++) {
        for (let cc = Math.floor(probe.x / TILE); cc <= Math.floor((probe.x + PW) / TILE); cc++) {
          const o = gridRect(g, rr, cc);
          if (o && !o.oneWay && hit(probe, o)) blocked = true;
        }
      }
      if (blocked) continue;
      tryArc({ x: sx, y: body.y, vx: d * 60, grounded: false }, function () { return d; }, false);
      tryArc({ x: sx, y: body.y, vx: d * MAX_RUN, grounded: false }, function () { return d; }, false);
    }
    // jumps; a running start needs somewhere behind to run from
    const runway = function (d) { return !!standAt(g, n.c - d, n.r); };
    for (let i = 0; i < JUMPS.length; i++) {
      const vx = JUMPS[i][0], dir = JUMPS[i][1];
      if (Math.abs(vx) === MAX_RUN && !runway(Math.sign(vx))) continue;
      tryArc({ x: body.x, y: body.y, vx: vx, grounded: true }, function () { return dir; }, true);
    }
    // Down through the shelf underfoot - standing, steering either way, and from
    // a run along it. A move the player has and the checker lacks is a place the
    // player can reach that the dead-end test never looks at, which is the one
    // direction this checker is not allowed to be wrong in.
    const underfoot = gridRect(g, n.r, n.c);
    if (underfoot && underfoot.oneWay) {
      const DROPS = [[0, 0], [0, -1], [0, 1], [MAX_RUN, 1], [-MAX_RUN, -1]];
      for (let i = 0; i < DROPS.length; i++) {
        const vx = DROPS[i][0], dir = DROPS[i][1];
        if (vx && !runway(Math.sign(vx))) continue;
        tryArc({ x: body.x, y: body.y, vx: vx, grounded: false, dropT: DROP_T }, function () { return dir; }, false);
      }
    }
    for (const d of [-1, 1]) {        // straight up, then drift over a ledge overhead
      tryArc({ x: body.x, y: body.y, vx: 0, grounded: true }, function (i) { return i < 14 ? 0 : d; }, true);
    }
  }

  // every reachable place must still be able to reach the exit
  const exits = [];
  nodes.forEach(function (n, k) { if (n.c >= PLAN.E && n.r === ROWS - 1) exits.push(k); });
  if (!exits.length) return null;
  const back = new Map();
  out.forEach(function (set, k) { set.forEach(function (t) { if (!back.has(t)) back.set(t, []); back.get(t).push(k); }); });
  const good = new Set(exits), q = exits.slice();
  while (q.length) {
    const k = q.pop();
    (back.get(k) || []).forEach(function (f) { if (!good.has(f)) { good.add(f); q.push(f); } });
  }
  let trapped = 0;
  nodes.forEach(function (n, k) { if (!good.has(k)) trapped++; });
  return { nodes: nodes, good: good, trapped: trapped, box: box, card: card };
}

// --- what goes on it -----------------------------------------------------------
function placePickups(g, R, rand) {
  const key = function (c, r) { return r * COLS + c; };
  const busy = function (c, r) { return g[r][c] !== '.'; };
  const G = ROWS - 2;                                   // the row you stand in on the floor
  g[G][PLAN.P] = 'P'; g[G][PLAN.S] = 'S'; g[G][PLAN.E] = 'E';
  if (!R.card.has(key(PLAN.T, G))) return false;
  g[G][PLAN.T] = 'T';

  // Stand-over tiles: the tile just above somewhere you can stand. Cards go on
  // the highest of these near their classic column - or, over the bare floor,
  // up to two rows higher, where the classic level floated them - and only
  // where the checker saw a body touch.
  const over = [];
  R.nodes.forEach(function (n) { over.push({ c: n.c, r: n.r - 1, floor: n.r === ROWS - 1 }); });
  for (let i = 0; i < PLAN.cards.length; i++) {
    const cd = PLAN.cards[i];
    let best = null;
    over.forEach(function (t) {
      if (Math.abs(t.c - cd.col) > 4) return;
      for (let lift = 0; lift <= (t.floor ? 2 : 0); lift++) {
        const r = t.r - lift;
        if (r < 1 || busy(t.c, r) || !R.card.has(key(t.c, r))) continue;
        if (!best || r < best.r || (r === best.r && Math.abs(t.c - cd.col) < Math.abs(best.c - cd.col))) best = { c: t.c, r: r };
      }
    });
    if (!best) return false;
    g[best.r][best.c] = 'c';
  }

  // boxes: each act's classic count, in runs of one to three along a surface,
  // weighted towards high ground
  for (let act = 0; act < CLASSIC.length; act++) {
    let need = PLAN.boxes[act];
    // Never AT or PAST the exit: the door shuts behind the torch and a box out
    // there is one the run can never collect - measured, 53 of 301 seeds put
    // one or more past it, up to three.
    const pool = over.filter(function (t) {
      return Math.floor(t.c / 48) === act && Math.abs(t.c - PLAN.P) > 2 &&
             t.c < PLAN.E - 1 && R.box.has(key(t.c, t.r));
    });
    for (let tries = 0; need > 0 && pool.length && tries < 400; tries++) {
      const t = pickWeighted(pool, function (x) { return 1 + (G - x.r); }, rand);
      if (busy(t.c, t.r)) continue;
      const run = 1 + Math.floor(rand() * 3), dir = rand() < 0.5 ? -1 : 1;
      for (let i = 0; i < run && need > 0; i++) {
        const c = t.c + i * dir;
        if (c < 0 || c >= COLS || Math.floor(c / 48) !== act || c >= PLAN.E - 1) break;
        if (busy(c, t.r) || !R.box.has(key(c, t.r)) || !isSolidCh(g[t.r + 1][c])) break;
        g[t.r][c] = 'b'; need--;
      }
    }
    if (need > 0) return false;
  }

  // enemies: each act's classic kinds, on open floor with room to patrol, well
  // clear of the spawn and never past the spider trigger
  for (let act = 0; act < CLASSIC.length; act++) {
    const spots = [];
    for (let c = act * 48; c < act * 48 + 48; c++) {
      if (c < PLAN.P + 12 || c > PLAN.S - 4) continue;
      let ok = true;
      for (let d = -2; d <= 2; d++) {
        const cc = c + d;
        if (cc < 0 || cc >= COLS || g[ROWS - 1][cc] !== '#' || isSolidCh(g[G][cc]) || !R.good.has(key(cc, ROWS - 1))) ok = false;
      }
      if (ok) spots.push(c);
    }
    const placed = [];
    const kinds = PLAN.enemies[act];
    for (let i = 0; i < kinds.length; i++) {
      let got = false;
      for (let tries = 0; tries < 60 && !got && spots.length; tries++) {
        const c = spots[Math.floor(rand() * spots.length)];
        if (busy(c, G) || placed.some(function (p) { return Math.abs(p - c) < 6; })) continue;
        g[G][c] = kinds[i]; placed.push(c); got = true;
      }
      if (!got) return false;
    }
  }
  return true;
}

function generateLevel(rand) {
  const g = [];
  for (let r = 0; r < ROWS; r++) g.push(new Array(COLS).fill(r === ROWS - 1 ? '#' : '.'));
  carveTerrain(g, rand);
  const R = checkRoutes(g);
  if (!R || R.trapped) return null;
  if (!placePickups(g, R, rand)) return null;
  return g.map(function (row) { return row.join(''); });
}

// Build and install a layout. A rejected attempt moves on to a seed derived
// from the last, so a given seed always ends at the same layout; levelSeed is
// the one that was actually built, which is what ?seed= needs to rebuild it.
function newLevel(seed) {
  if (seed === 'classic') { parseLevel(classicGrid()); levelSeed = 'classic'; return; }
  let s = (seed == null ? Math.random() * 4294967296 : seed) >>> 0;
  for (let attempt = 0; attempt < 12; attempt++) {
    const grid = generateLevel(mulberry32(s));
    if (grid) { parseLevel(grid); levelSeed = s; return; }
    s = (Math.imul(s, 1103515245) + 12345) >>> 0;
  }
  parseLevel(classicGrid()); levelSeed = 'classic';     // twelve rejections: the hand-built level
}
newLevel(SEED_PARAM);

// TORCH_DESIGN is what resetRun() hands the 'T' pickup.
const CARD_NAMES = [['LAVA TITAN','IGNIS CORE'], ['TIDAL SOVEREIGN','AQUA LUXIA'],
                    ['EARTH GUARDIAN','TERRASTONE ANCIENT'], ['RB #27','BLAZE'],
                    ['ALL-STAR LB','THUNDER'], ['UNIT 47','D.T.C.']];
const TORCH_DESIGN = CARD_NAMES.length - 1;
const CARD_STEP = 100 / (CARD_NAMES.length - 1);   // background-position per design

// Draw sprite frame `f`, bottom-centred on (x, y). flip = facing left.
// `sink` lets a frame hang below that line for art that is drawn past its own
// ground contact - see ART.rat - and defaults to nothing.
function sprite(key, f, x, y, flip) {
  const a = ART[key];
  if (!a || !a.ready) return false;
  const fw = a.img.width / a.n, fh = a.img.height;   // native frame size, whatever it is
  const sx = (f % a.n) * fw;
  ctx.save();
  ctx.translate(Math.round(x * S) / S, Math.round(y * S) / S);   // snap to the render grid
  if (flip) ctx.scale(-1, 1);
  ctx.drawImage(a.img, sx, 0, fw, fh, -a.bw / 2, -a.bh + (a.sink || 0), a.bw, a.bh);
  ctx.restore();
  return true;
}

/* ==========================================================================
   5. CANVAS
   ========================================================================== */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha:false });
canvas.width = VIEW_W * S; canvas.height = VIEW_H * S;
ctx.imageSmoothingEnabled = false;

// How much world the view may show vertically. The cap was 420 once, which on
// a 393x852 phone meant 84 units of ROOF above a level only 336 tall, and the
// five rows anyone plays in down to 29% of the screen. 300 took the roof away.
// 240 takes 60 units of WALL with it: standing on the floor the view runs from
// y=96 now rather than y=36, the playfield is half of it against 40%, and the
// camera pans up the moment the player climbs.
// IT MAKES THE PICTURE SHORTER, NOT THE CHARACTER BIGGER. Canvas height is
// VIEW_H x scale, so 60 units off the view is 74 CSS pixels off the canvas on
// that phone, and they come back as letterbox. That is the whole trade: less
// dead wall inside the frame, more dark outside it. Only VIEW_W makes anything
// bigger, and the chase sets a floor under how far that can go.
const VIEW_H_MIN = 200, VIEW_H_MAX = 240;
// env(safe-area-inset-*) is a CSS value and nothing in script can read one, so
// #safe is padded by two of them and measured here. It is not cosmetic: the
// page runs under the notch (viewport-fit=cover), #hud is placed below the
// inset and the stage has to hold back the same amount or the status line is
// drawn over the top of the game.
const safeEl = document.getElementById('safe');
function safeInset() {
  if (typeof getComputedStyle !== 'function' || !safeEl) return { top:0, bottom:0 };
  const s = getComputedStyle(safeEl);
  return { top: parseFloat(s.paddingTop) || 0, bottom: parseFloat(s.paddingBottom) || 0 };
}

let safeSeen = { top:0, bottom:0 };    // what the last resize() measured, for ?fps
function resize() {
  const portrait = window.innerHeight > window.innerWidth;
  const touch    = pad.classList.contains('on');
  const safe     = safeInset();
  safeSeen = safe;
  // The same max() #stage's padding-top uses, for the same reason: the inset is
  // zero wherever the browser has already put the page below its own furniture.
  const padTop   = portrait ? Math.max(96, safe.top + 84) : safe.top + 28;
  const reserve  = touch && portrait ? 224 + safe.bottom : 0;   // the d-pad, portrait only
  const availH   = window.innerHeight - padTop - reserve;

  // THE ZOOM. A phone held tall gets the narrow view. A phone turned sideways
  // does not: there it is HEIGHT that is short, the canvas is already fitted to
  // it, and narrowing the view would only show less world at the same size.
  // Anything wide enough not to be a phone keeps 384 as well.
  VIEW_W = (touch && portrait && window.innerWidth <= 560) ? VIEW_W_PHONE : VIEW_W_WIDE;
  BG_OPEN_X = openBayX();                         // VIEW_W is in it

  let   scale    = window.innerWidth / VIEW_W;    // horizontal zoom: fixed by VIEW_W

  // Vertical is whatever is actually on the screen. A fixed 16:9 canvas left
  // ~450 CSS points of dead band between the game and the thumb buttons; this
  // spends it on visible world instead. The character does not change size —
  // its pixel height comes from VIEW_W, which is untouched.
  let vh = Math.floor(availH / scale);
  if (vh < VIEW_H_MIN) { vh = VIEW_H_MIN; scale = availH / vh; }  // short viewport: fit height, letterbox width
  VIEW_H = Math.min(VIEW_H_MAX, vh);

  canvas.width  = VIEW_W * S;
  canvas.height = VIEW_H * S;
  ctx.imageSmoothingEnabled = false;     // resizing the backing store resets this
  canvas.style.width  = Math.round(VIEW_W * scale) + 'px';
  canvas.style.height = Math.round(VIEW_H * scale) + 'px';
  refreshPadRects();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 120); });

/* ==========================================================================
   6. INPUT — keyboard + multitouch tracked per finger identifier
   ========================================================================== */
const input = { left:false, right:false, jump:false, jumpPressed:false, down:false, downPressed:false, locked:false };
const keys  = { left:false, right:false, jump:false, down:false };
const pad = document.getElementById('pad');
const dpadEl = document.getElementById('dpad'), jumpEl = document.getElementById('bJump');
const armEl = { up:document.getElementById('bUp'),   down:document.getElementById('bDown'),
                left:document.getElementById('bLeft'), right:document.getElementById('bRight') };
let dpadRect = null, jumpRect = null;
const touches = new Map();                 // touch identifier -> the actions it holds
if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
  pad.classList.add('on');
  document.body.classList.add('touch');      // the stage leaves room for the pad
}
document.body.classList.add('sheeted');     // the splash is up; no pad under it

// The pad is hidden while any sheet is showing, and a hidden pad measures zero,
// so its rects have to be taken again on the way in and on the way out. Held
// touches go with it: a thumb down on the pad when the sheet arrives would
// otherwise still be held when the next run starts.
function showPad(on) {
  document.body.classList.toggle('sheeted', !on);
  if (!on) { touches.clear(); syncInput(); }
  refreshPadRects();
}

function refreshPadRects() {
  dpadRect = dpadEl.getBoundingClientRect();
  jumpRect = jumpEl.getBoundingClientRect();
}
// THE D-PAD IS ONE HIT TEST, NOT FOUR. Where the thumb is inside the cross is
// read as -1..1 on each axis, and anything past DPAD_DEAD on an axis is that
// direction held - so a CORNER holds two, which is the whole point of a cross:
// one thumb can run and jump, or hold right and drop through a shelf. Four
// rects cannot do that, and stretched enough to be reachable they overlap along
// every shared edge, where the first one in the list would win the roll. That
// overlap is why DOWN used to sit above JUMP on the right instead of beside the
// arrows, and it is why it no longer has to.
// JUMP is tested first, so where the two live regions touch - which they only
// do on a screen narrower than 375px - the big obvious button wins.
const DPAD_EDGE = 14;        // live margin round the cross, CSS px
const DPAD_DEAD = 0.3;       // the hub, as a fraction of the cross's half-width
function hitTest(x, y) {
  const j = jumpRect;
  if (j && j.width && x >= j.left - 10 && x <= j.right + 10 &&
      y >= j.top - 20 && y <= j.bottom + 20) return ['jump'];
  const r = dpadRect;
  if (!r || !r.width) return null;
  if (x < r.left - DPAD_EDGE || x > r.right + DPAD_EDGE ||
      y < r.top  - DPAD_EDGE || y > r.bottom + DPAD_EDGE) return null;
  const dx = (x - (r.left + r.right) / 2) / (r.width / 2);
  const dy = (y - (r.top + r.bottom) / 2) / (r.height / 2);
  const acts = [];
  if (dx < -DPAD_DEAD) acts.push('left'); else if (dx > DPAD_DEAD) acts.push('right');
  if (dy < -DPAD_DEAD) acts.push('jump'); else if (dy > DPAD_DEAD) acts.push('down');
  return acts;               // [] on the hub: on the pad, holding nothing
}
function syncInput() {
  let l = keys.left, r = keys.right, j = keys.jump, d = keys.down;
  touches.forEach(function (acts) {
    for (let i = 0; i < acts.length; i++) {
      const a = acts[i];
      if (a === 'left') l = true; else if (a === 'right') r = true;
      else if (a === 'jump') j = true; else if (a === 'down') d = true;
    }
  });
  if (j && !input.jump) input.jumpPressed = true;
  if (d && !input.down) input.downPressed = true;     // a tap between two frames still drops
  input.left = l; input.right = r; input.jump = j; input.down = d;
  armEl.left.classList.toggle('held', l);
  armEl.right.classList.toggle('held', r);
  armEl.up.classList.toggle('held', j);               // UP is jump, wherever it came from
  armEl.down.classList.toggle('held', d);
  jumpEl.classList.toggle('held', j);
}
// PREVENTDEFAULT ONLY FOR THE PAD. This used to fire on every touch anywhere
// on the page, and on a phone that also cancels the click the browser would
// synthesise afterwards - so RUN IT BACK and the mute button did nothing when
// tapped, while working fine under a mouse, which is why it shipped. Scrolling
// and zooming are already off through CSS (touch-action:none on body, plus
// user-select and touch-callout), so the only thing this call is needed for is
// keeping a thumb held on a pad button from turning into a text selection.
function tStart(e) {
  unlockAudio();
  let onPad = false;
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i], a = hitTest(t.clientX, t.clientY);
    if (a) { touches.set(t.identifier, a); onPad = true; }
  }
  if (onPad) e.preventDefault();
  syncInput();
}
function tMove(e) {
  let tracking = false;
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i], a = hitTest(t.clientX, t.clientY);
    if (touches.has(t.identifier)) tracking = true;
    if (a) touches.set(t.identifier, a); else touches.delete(t.identifier);
  }
  if (tracking) e.preventDefault();
  syncInput();
}
function tEnd(e) {
  for (let i = 0; i < e.changedTouches.length; i++) touches.delete(e.changedTouches[i].identifier);
  syncInput();
}
document.addEventListener('touchstart', tStart, { passive:false });
document.addEventListener('touchmove',  tMove,  { passive:false });
document.addEventListener('touchend',   tEnd,   { passive:false });
document.addEventListener('touchcancel',tEnd,   { passive:false });

function keyAct(code) {
  if (code === 'ArrowLeft'  || code === 'KeyA') return 'left';
  if (code === 'ArrowRight' || code === 'KeyD') return 'right';
  if (code === 'Space' || code === 'ArrowUp' || code === 'KeyW' || code === 'KeyZ') return 'jump';
  if (code === 'ArrowDown' || code === 'KeyS') return 'down';
  return null;
}
window.addEventListener('keydown', function(e){ const a=keyAct(e.code); if(!a)return; e.preventDefault(); keys[a]=true; syncInput(); });
window.addEventListener('keyup',   function(e){ const a=keyAct(e.code); if(!a)return; e.preventDefault(); keys[a]=false; syncInput(); });

/* ==========================================================================
   7. AUDIO — iOS starts the context suspended; the splash tap resumes it
   ========================================================================== */
let ac = null, dry = null, verb = null, wet = null;
let musicBuf = null, music = null, musicGain = null, muted = false, audioFailed = false;
const MUSIC_VOL = 0.5;
const FART_VOL = 0.6;            // the recording peaks at 0.97 and averages 0.10; the music
                                 // peaks 0.98, averages 0.14 and plays at 0.5, so this sits
                                 // level with it on average and well over it on the hit,
                                 // with headroom left before the mix clips
// THE GAME OVER CLIP WAS 0.9, WHICH IS NOT A MIX. The music plays at 0.5 and
// peaks at 0.98, so 0.9 of a clip that peaks near full scale sums well past 1
// and LOOPS there until RUN IT BACK - and what comes back out of a converter
// asked for more than it has is not two sounds, it is both of them squashed.
// That is what "the music changes after the spider" sounds like. At 0.45 the
// worst case is about 0.94 and the clip is still the loudest thing on the
// sheet. Nothing in the game moves the MUSIC's own gain: it is written in
// playMusic(), in setMuted() and in resetMusicLevel(), and nowhere else.
const LOSER_VOL = 0.45;
const muteEl = document.getElementById('mute');

// An exponentially decaying noise burst makes a serviceable room reverb, and
// generating it costs nothing to ship - no impulse-response file to download.
function makeIR(seconds, decay) {
  const rate = ac.sampleRate, n = Math.floor(rate * seconds);
  const buf = ac.createBuffer(2, n, rate);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, decay);
  }
  return buf;
}

function unlockAudio() {
  if (!ac) {
    const A = window.AudioContext || window.webkitAudioContext; if (!A) return;
    ac = new A();
    dry = ac.createGain(); dry.gain.value = muted ? 0 : 1.0; dry.connect(ac.destination);
    verb = ac.createConvolver(); verb.buffer = makeIR(2.8, 2.2);
    wet = ac.createGain(); wet.gain.value = muted ? 0 : 0.55;
    verb.connect(wet); wet.connect(ac.destination);
    loadMusic();
    loadFart();
    loadLoserSound();
  }
  if (ac.state === 'suspended') ac.resume().then(refreshAudioLabel);
  playMusic();
  refreshAudioLabel();
}

function loadMusic() {
  if (typeof fetch !== 'function') return;
  fetch('audio/theme.mp3')
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
    .then(function (b) {
      return new Promise(function (res, rej) { ac.decodeAudioData(b, res, rej); });
    })
    .then(function (buf) { musicBuf = buf; playMusic(); })
    .catch(function (err) {
      // Say so rather than swallowing it. A silent catch here meant a failed
      // decode was indistinguishable from a muted browser.
      audioFailed = true;
      if (muteEl) muteEl.textContent = 'NO MUSIC';
      if (window.console) console.warn('soundtrack failed to load:', err);
    });
}

// Any gesture retries the unlock. Browsers suspend the context for all sorts
// of reasons after the first tap; one entry point was too few.
window.addEventListener('pointerdown', unlockAudio);
window.addEventListener('keydown', function (e) {
  unlockAudio();
  if (e.code === 'KeyM') setMuted(!muted);
});

// MP3 carries encoder delay and padding inside the stream, so the decoded
// buffer has silence at both ends. Looping the whole buffer would put that
// silence at the seam on every pass. Find the first and last sample that is
// actually audible and loop between those instead - no Xing/LAME header
// parsing, and it holds for whatever encoder produced the file.
function audibleRange(buf) {
  const d = buf.getChannelData(0), n = d.length, thr = 0.0015;
  let a = 0, b = n - 1;
  while (a < n && Math.abs(d[a]) < thr) a++;
  while (b > a && Math.abs(d[b]) < thr) b--;
  if (a >= b) return { start: 0, end: buf.duration };            // all quiet; use it whole
  return { start: a / buf.sampleRate, end: (b + 1) / buf.sampleRate };
}

function playMusic() {
  if (!musicBuf || music || !ac || ac.state !== 'running') return;
  const r = audibleRange(musicBuf);
  music = ac.createBufferSource();
  music.buffer = musicBuf;
  music.loop = true;
  music.loopStart = r.start; music.loopEnd = r.end;
  musicGain = ac.createGain();
  musicGain.gain.value = muted ? 0 : MUSIC_VOL;
  music.connect(musicGain); musicGain.connect(ac.destination);
  music.start(0, r.start);
}

// Reports real state, so a silent game can be told apart from a muted one.
function audioLabel() {
  if (audioFailed) return '\u26A0 NO MUSIC';
  if (!ac || ac.state !== 'running') return '\uD83D\uDD08 TAP FOR SOUND';
  return muted ? '\uD83D\uDD07 MUTED' : '\uD83D\uDD0A SOUND ON';
}
function refreshAudioLabel() {
  if (muteEl) muteEl.textContent = audioLabel();
}
setInterval(refreshAudioLabel, 500);

// Puts the music back where it belongs, with a short ramp so it is not a step.
// Nothing should ever have moved it - but a run that has just been through the
// crush has had the loudest thing in the game looping over it, and calling this
// from resetRun() makes "the music is at MUSIC_VOL" true by assertion at the
