// start of every run rather than by reading the code.
function resetMusicLevel() {
  if (!musicGain || !ac) return;
  const t = ac.currentTime;
  musicGain.gain.cancelScheduledValues(t);
  musicGain.gain.setValueAtTime(musicGain.gain.value, t);
  musicGain.gain.linearRampToValueAtTime(muted ? 0 : MUSIC_VOL, t + 0.15);
}

function setMuted(m) {
  muted = m;
  if (musicGain) musicGain.gain.value = m ? 0 : MUSIC_VOL;
  if (dry) dry.gain.value = m ? 0 : 1.0;
  if (wet) wet.gain.value = m ? 0 : 0.55;
  refreshAudioLabel();
}
if (muteEl) muteEl.addEventListener('click', function (e) {
  // Unlock here too. This button sits over the splash, and stopPropagation
  // means the splash never sees the click - so without this, tapping the
  // thing labelled SOUND ON was the one gesture that guaranteed silence.
  e.stopPropagation();
  unlockAudio();
  setMuted(!muted);
});

// Synth bell: inharmonic partials, near-instant attack, long exponential tail,
// sent to the reverb as well as the dry bus. The 2.76 and 5.4 ratios are what
// stop it sounding like a plain sine beep.
const BELL = [[1, 1, 1], [2.01, 0.46, 0.72], [2.76, 0.26, 0.55], [5.42, 0.11, 0.34]];
function chime(freq, dur, vol) {
  if (!ac || ac.state !== 'running') return;
  const t = ac.currentTime, out = ac.createGain();
  out.gain.value = vol == null ? 0.055 : vol;
  out.connect(dry); out.connect(verb);
  for (let i = 0; i < BELL.length; i++) {
    const p = BELL[i], o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(freq * p[0], t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(p[1], t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur * p[2]);
    o.connect(g); g.connect(out);
    o.start(t); o.stop(t + dur * p[2] + 0.05);
  }
}

function blip(freq, dur, type, vol) {
  if (!ac || ac.state !== 'running') return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, ac.currentTime);
  g.gain.setValueAtTime(vol || 0.05, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
  o.connect(g); g.connect(dry); g.connect(verb);
  o.start(); o.stop(ac.currentTime + dur);
}
function noise(dur, vol) {
  if (!ac || ac.state !== 'running') return;
  const n = Math.floor(ac.sampleRate * dur);
  const buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = ac.createBufferSource(), g = ac.createGain();
  s.buffer = buf; g.gain.value = vol || 0.08;
  s.connect(g); g.connect(dry); g.connect(verb); s.start();
}

// GRIMACE'S FART is audio/fart.mp3 - a recording, reverb and all, in place of
// the synthesiser that used to be here. Loaded and decoded beside the
// soundtrack, through the same context and the same failure handling.
//
// `env` is the loudness per 1/60s frame, 0..1, measured off the decoded buffer,
// and render() shakes the screen by it - so the rumble is this recording's own
// shape and follows its tail down, rather than a curve typed here to look like
// one. `fartQuiet` is when it drops under QUIET for the last time, which is
// when the sheet comes up: the file runs 3.3s and most of that is reverb tail,
// and the screen should not sit shaking through it.
//
// Nothing decoded means no sound, but the beat still has to play, so env falls
// back to a plain decay. That is also what Node gets, because load_game has no
// fetch - so the tools measure a fixed timeline rather than a missing one.
const FART_AT = 0.35;            // s after he lands: the thud, a beat, then this
const QUIET   = 0.08;            // of the peak; under this it is only the room
let fartBuf = null, fartEnv = null, fartQuiet = 1.2;
const FART_FALLBACK = (function () {
  const n = 72, e = new Float32Array(n);                    // 1.2s at 60fps
  for (let i = 0; i < n; i++) e[i] = Math.exp(-i / 26);
  return e;
})();

function loadFart() {
  if (typeof fetch !== 'function') return;
  fetch('audio/fart.mp3')
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
    .then(function (b) {
      return new Promise(function (res, rej) { ac.decodeAudioData(b, res, rej); });
    })
    .then(function (buf) { fartBuf = buf; measureFart(buf); })
    .catch(function (err) { if (window.console) console.warn('fart failed to load:', err); });
}

function measureFart(buf) {
  const d = buf.getChannelData(0), rate = buf.sampleRate;
  const frames = Math.ceil(buf.duration * 60), env = new Float32Array(frames);
  let top = 0;
  for (let k = 0; k < frames; k++) {
    let sum = 0;
    const a = Math.floor(k * rate / 60), b = Math.min(d.length, Math.floor((k + 1) * rate / 60));
    for (let i = a; i < b; i++) sum += d[i] * d[i];
    env[k] = Math.sqrt(sum / Math.max(1, b - a));
    top = Math.max(top, env[k]);
  }
  let last = 0;
  for (let k = 0; k < frames; k++) { env[k] /= (top || 1); if (env[k] > QUIET) last = k; }
  fartEnv = env; fartQuiet = (last + 1) / 60;
}

// Dry only: the recording carries its own reverb, and the convolver on top of
// that is mush.
function fart() {
  if (fartBuf && ac && ac.state === 'running') {
    const s = ac.createBufferSource(), g = ac.createGain();
    s.buffer = fartBuf; g.gain.value = FART_VOL;
    s.connect(g); g.connect(dry); s.start();
  }
  return fartEnv || FART_FALLBACK;
}

/* ==========================================================================
   8. STATE
   ========================================================================== */
let safeX = 0, safeY = 0;   // last confirmed footing, used as the respawn point
const player = { x:0, y:0, w:Math.round(13*HERO), h:Math.round(38*HERO), vx:0, vy:0, grounded:false, face:1, invuln:0, anim:0, dropT:0 };
const cam = { x:0, y:0, shake:0 };
// lunge counts DOWN through a snap upwards; base is where the legs are, and y
// is base minus the lift, so the collision box goes up with the picture.
const spider = { x:0, y:0, base:0, lift:0, lunge:0, w:64, h:44, active:false, burn:0, char:0, anim:0 };
// IT SNAPS AT ANYONE OVER IT. Getting behind the spider is what brings Grimace
// down, and it was far too easy: from flat ground, measured over a sweep of
// distances and jump timings, 364 of 1681 attempts cleared it. It should cost
// something - a box stack to jump from, deliberately - so when the player is
// airborne and close, it rears LUNGE_UP units over LUNGE_T seconds. His feet
// reach 82 units over the floor at the apex of a jump, and 106 from a one-tile
// stack, so a rear to 84 is over one and under the other. Touching it while it
// is up is an ordinary hit: a mistimed jump costs a respawn in front of it.
const LUNGE_UP = 40, LUNGE_T = 0.42, LUNGE_NEAR = 95;
const torch  = { x:0, y:0, active:false, t:0, done:false, phase:'none', pt:0, anim:0, burnX:0 };
// THE UNIT AT THE END IS SHUT until the torch settles the spider: the truck
// does not get loaded with that thing still chasing. It is one boolean and not
// an animation, because the moment it opens is always off screen - the torch
// card sits at a fixed column, so the camera is at 3989 when the spider dies
// and the bay tile is at 417..577 against a 384-unit view. Measured on eleven
// layouts, all identical: the player is input-locked through the cutscene, so
// nothing about the run can move it.
// Shut is drawn by NOT drawing the open bay. The wall is already tiled with
// the closed-door art, so the end of the unit is a shut door like every other
// one, and there is no second door to match to the first. Overlaying a shutter
// on the open bay was the other option and it cannot work: bg_closed.png and
// bg_open.png are different photographs that differ across the whole tile
// (only 42% of pixels alike), so any frame showing both shows the join.
// What opens it is forced by the plan, S before T before E (tools/audit.js
// checks that ordering now): the spider has to be triggered before the torch
// card will summon anyone, and both sit left of the door on every layout.
function gateShut() { return !torch.done; }
let gateBump = 0;                // counts down after the player runs into it

// WHAT LANDS ON YOU IF YOU GET BEHIND THE SPIDER. The chase runs one way:
// it comes from the left and the way out is right. Ending up to its LEFT is
// not a mistake the level can make for you - touching it costs a hit and puts
// you back in front of it - so the only way there is to jump clean over it,
// and that is a decision. grim.y is the BOTTOM of him, the way sprite()
// measures; grim.down is the landing, which is also when the player stops
// being drawn, because by then he is underneath.
// grim.drop is whether he has been released at all: he waits for the player
// to come down first. grim.onFloor is whether he landed on concrete, which is
// the only thing that cracks - a box stack or a shelf just takes the slam.
// grim.env is the fart's loudness per frame once he has let it go, null before -
// see fart(); it is what the screen rumbles by.
const grim = { x:0, y:0, vy:0, t:0, drop:false, down:false, onFloor:false, env:null };
// Where something got stomped into the concrete, and when. They stay for the
// rest of the run: the floor keeps the score even though the sheet will not.
let stomps = [];
const STOMP_REACH = 26;          // units either side, the cracks strip's middle
const STOMP_GROW  = 0.18;        // s to spread that far
const GRIM_G = 4200;             // u/s^2 - he is not falling, he is arriving
let crushed = false;             // this run ended under him; the sheet says so

let boxes = [], cards = [], enemies = [], loose = [];
let state = 'play';            // play | cutscene | ending | score
let clock = 0, boxesGot = 0, cardsGot = 0, hits = 0, bonusPts = 0;
let coyoteT = 0, bufferT = 0, chaseStartX = 0, cutT = 0, endT = 0;
let finalScore = 0, grade = 'C';

function resetRun() {
  player.x = spawn.x; player.y = spawn.y; safeX = spawn.x; safeY = spawn.y;
  player.vx = 0; player.vy = 0; player.grounded = false; player.invuln = 0; player.face = 1; player.dropT = 0;
  cam.x = 0; cam.y = LEVEL_H - VIEW_H; cam.shake = 0;
  stomps = [];
  boxes = boxSpots.map(function(b){ return { x:b.x, y:b.y, got:false }; });
  // The torch card is always the LAST design - the D.T.C. card, the one whose
  // full-screen graphic the pickup freezes the game behind. The rest take
  // 0..4 in the order the level parser found them. tools/make_cards.py owns
  // that order; this index has to agree with it.
  let nextDesign = 0;
  cards = cardSpots.map(function(c){
    return { x:c.x, y:c.y, torch:c.torch, got:false, design: c.torch ? TORCH_DESIGN : nextDesign++ };
  });
  enemies = enemySpots.map(function(e){
    const h = e.kind === 'rat' ? 14 : 10, w = e.kind === 'rat' ? 20 : 16;
    return { x:e.x, y:e.y - h, w:w, h:h, vx:(e.kind==='rat'?-46:-84), kind:e.kind, dead:0, anim:0 };
  });
  loose = []; gateBump = 0;
  grim.t = 0; grim.vy = 0; grim.drop = false; grim.down = false; grim.onFloor = false; grim.env = null;
  crushed = false;
  spider.active = false; spider.burn = 0; spider.char = 0; spider.anim = 0;
  spider.base = 0; spider.lift = 0; spider.lunge = 0;
  torch.active = false; torch.t = 0; torch.done = false; torch.phase = 'none'; torch.pt = 0; torch.anim = 0;
  state = 'play'; clock = 0; boxesGot = 0; cardsGot = 0; hits = 0; bonusPts = 0;
  resetMusicLevel();
  coyoteT = 0; bufferT = 0; cutT = 0; endT = 0;
  input.locked = false;
}

/* ==========================================================================
   9. PHYSICS — axis-separated AABB. X first, resolve, then Y, resolve.
   ========================================================================== */
function hit(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
// First solid surface at or below (x, fromY). Used to keep the spider on the
// floor - it is a walking enemy and must not inherit the player's altitude.
function surfaceBelow(x, fromY) {
  for (let y = Math.max(0, fromY); y < LEVEL_H + TILE; y += 2) if (pointSolid(x, y)) return y;
  return GROUND_Y;
}
function pointSolid(x, y) {
  for (let i = 0; i < solids.length; i++) {
    const s = solids[i];
    if (x >= s.x && x < s.x + s.w && y >= s.y && y < s.y + s.h) return true;
  }
  return false;
}
// SHELVES ARE ONE-WAY. A shelf stops a body only from above: moving down, with
// its feet at or above the shelf's top before this move, and not dropping. So a
// jump goes up through one, a walk goes through one sideways, and a body with
// dropT > 0 - the player pressing down on it - falls through. Box stacks and
// the floor still block from every side. gridCollide in the route checker is
// the same rule on the character grid: change one, change both.
function landsOn(e, s, feetBefore, dy) {
  return dy > 0 && !(e.dropT > 0) && feetBefore <= s.y + 0.01;
}
function moveAndCollide(e, dx, dy) {
  e.x += dx;
  for (let i = 0; i < solids.length; i++) {
    const s = solids[i];
    if (s.oneWay) continue;
    if (hit(e, s)) { if (dx > 0) e.x = s.x - e.w; else if (dx < 0) e.x = s.x + s.w; e.vx = 0; }
  }
  const feetBefore = e.y + e.h;
  e.y += dy;
  e.grounded = false;
  for (let i = 0; i < solids.length; i++) {
    const s = solids[i];
    if (s.oneWay && !landsOn(e, s, feetBefore, dy)) continue;
    if (hit(e, s)) {
      if (dy > 0) { e.y = s.y - e.h; e.grounded = true; }
      else if (dy < 0) { e.y = s.y + s.h; }
      e.vy = 0;
    }
  }
  // Here, not in the callers: the player is moved by updatePlayer, the torch
  // cutscene and the crush, and a timer each of them had to remember to count
  // down is a timer one of them would forget. Every frame is one STEP.
  if (e.dropT > 0) e.dropT -= STEP;
}

// Is every solid under his feet a shelf? Down on a box stack, or on the floor, or
// straddling a shelf and a stack, does nothing - there is nothing to fall to.
function standingOnShelf(e) {
  const feet = e.y + e.h;
  let shelf = false;
  for (let i = 0; i < solids.length; i++) {
    const s = solids[i];
    if (e.x + e.w <= s.x || e.x >= s.x + s.w || Math.abs(s.y - feet) > 0.5) continue;
    if (!s.oneWay) return false;
    shelf = true;
  }
  return shelf;
}
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

/* ==========================================================================
   10. UPDATE
   ========================================================================== */
function damage() {
  if (player.invuln > 0) return;
  player.invuln = INVULN; hits++;
  player.vy = -260; player.vx = -player.face * 190;
  cam.shake = 6;
  noise(0.18, 0.10); blip(180, 0.18, 'sawtooth');
  if (boxesGot > 0) {                       // drop one box; it can be re-grabbed
    boxesGot--;
    loose.push({ x:player.x + 9, y:player.y + 10, vx:player.face * -60, vy:-200, t:0 });
  }
}

function updatePlayer(dt) {
  const dir = input.locked ? 0 : ((input.right ? 1 : 0) - (input.left ? 1 : 0));
  const a = player.grounded ? ACCEL : AIR_ACCEL;
  if (dir !== 0) {
    player.vx = clamp(player.vx + dir * a * dt, -MAX_RUN, MAX_RUN);
    player.face = dir;
  } else if (player.grounded) {
    const drop = FRICTION * dt;
    player.vx = Math.abs(player.vx) <= drop ? 0 : player.vx - Math.sign(player.vx) * drop;
  }

  // Down on a shelf: fall through it. Coyote time goes with the ground, or the
  // jump that normally follows stepping off a ledge would pull him straight back
  // up through the shelf he meant to leave. Held down drops through one shelf
  // after another; a tap drops through one.
  if (!input.locked && (input.down || input.downPressed) && player.grounded && standingOnShelf(player)) {
    player.dropT = DROP_T; player.grounded = false; coyoteT = 0;
  }
  input.downPressed = false;
  coyoteT = player.grounded ? COYOTE : Math.max(0, coyoteT - dt);
  if (input.jumpPressed) { if (!input.locked) bufferT = BUFFER; input.jumpPressed = false; }
  else bufferT = Math.max(0, bufferT - dt);

  if (bufferT > 0 && coyoteT > 0) {
    player.vy = JUMP_V; bufferT = 0; coyoteT = 0;
    chime(523, 0.35, 0.035);
  }
  // Tap to jump: one press gives the whole arc, no hold required. The apex is
  // still JUMP_V against GRAVITY (82u), so the audit's jump budget is unchanged.
  if (input.locked && player.vy < JUMP_CUT) player.vy = JUMP_CUT;

  player.vy = Math.min(player.vy + GRAVITY * dt, MAX_FALL);
  moveAndCollide(player, player.vx * dt, player.vy * dt);

  player.x = clamp(player.x, 0, LEVEL_W - player.w);
  // exitX is the bay's CENTRE at the camera the player finishes at - the art
  // is drawn centred on it - so stopping him here stands him in front of the
  // door rather than inside its frame.
  if (gateShut() && player.x + player.w > exitX) {
    if (player.vx > 40 && gateBump <= 0) {          // ran into it: thud and rattle
      gateBump = 0.3; noise(0.1, 0.05); blip(110, 0.09, 'square', 0.03);
    }
    player.x = exitX - player.w;
    if (player.vx > 0) player.vx = 0;
  }
  if (player.grounded && player.y < LEVEL_H) { safeX = player.x; safeY = player.y; }
  if (player.y > LEVEL_H + 80) {           // fell in a gap: back to the last footing, not the start
    player.x = spider.active ? chaseStartX : safeX;
    player.y = (spider.active ? 40 : safeY) - 4;
    player.vx = 0; player.vy = 0;
    if (spider.active) resetChase();
    damage();
  }
  if (player.invuln > 0) player.invuln -= dt;
  // /13 not /26: the run cycle is 8 frames now, so the per-frame rate doubles
  // to keep the same stride cadence.
  player.anim += dt * (player.grounded ? Math.abs(player.vx) / 13 : 4);
}

function updateStomps(dt) { for (let i = 0; i < stomps.length; i++) stomps[i].t += dt; }

function updateEnemies(dt) {
  // Backwards, because dead enemies are spliced out mid-loop.
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.dead > 0) {
      e.dead -= dt;
      if (e.dead <= 0) enemies.splice(i, 1);   // gone for the rest of the run
      continue;
    }
    e.anim += dt * 8;
    const nx = e.x + e.vx * dt;
    const probeX = e.vx > 0 ? nx + e.w + 1 : nx - 1;
    // turn at a ledge or a wall
    if (!pointSolid(probeX, e.y + e.h + 3) || pointSolid(probeX, e.y + e.h - 3)) e.vx = -e.vx;
    else e.x = nx;

    if (hit(player, e)) {
      const stomping = player.vy > 60 && (player.y + player.h) - e.y < 16;
      if (stomping) {
        // He does not bounce off it any more - he drives it into the floor and
        // keeps falling. vy 0 rather than a small hop, so the landing right
        // after is his own weight. The concrete keeps the mark, if it WAS
        // concrete: a rat stomped on a shelf or a box stack just dies.
        e.dead = 0.35; player.vy = 0; bonusPts += SCORE.stomp;
        cam.shake = Math.max(cam.shake, 6);
        // Concrete under it, not just floor height: a rat stomped in mid-air over
        // a pit is at GROUND_Y too, and there is nothing there to crack.
        if (Math.abs((e.y + e.h) - GROUND_Y) < 1 && pointSolid(e.x + e.w / 2, GROUND_Y + 2))
          stomps.push({ x: e.x + e.w / 2, t: 0 });
        chime(392, 0.5, 0.05); noise(0.14, 0.09);
      } else damage();
    }
  }
}

function updatePickups(dt) {
  for (let i = 0; i < boxes.length; i++) {
    const b = boxes[i]; if (b.got) continue;
    if (hit(player, { x:b.x - 14, y:b.y - 14, w:28, h:28 })) {
      b.got = true; boxesGot++;
      chime(660 + (boxesGot % 6) * 55, 0.9, 0.05);
    }
  }
  for (let i = 0; i < cards.length; i++) {
    const c = cards[i]; if (c.got) continue;
    if (hit(player, { x:c.x - 14, y:c.y - 16, w:28, h:32 })) {
      c.got = true; cardsGot++;
      // The torch card gets the full-screen splash instead of the slide-in
      // banner; both at once is two announcements fighting for the top of the
      // screen. Picked up before the chase, it is just a card, so it banners.
      const summons = c.torch && spider.active;
      if (!summons) showCardBanner(c.design);
      chime(880, 1.5, 0.06);
      setTimeout(function(){ chime(1320, 1.8, 0.055); }, 90);
      if (summons) startTorchCutscene();
    }
  }
  for (let i = loose.length - 1; i >= 0; i--) {
    const l = loose[i];
    l.t += dt; l.vy += GRAVITY * dt;
    const probe = { x:l.x - 5, y:l.y - 5, w:10, h:10, vx:0, vy:l.vy };
    moveAndCollide(probe, l.vx * dt, l.vy * dt);
    l.x = probe.x + 5; l.y = probe.y + 5;
    if (probe.grounded) { l.vy = 0; l.vx *= 0.7; }
    if (l.t > 0.4 && hit(player, { x:l.x - 14, y:l.y - 14, w:28, h:28 })) {
      loose.splice(i, 1); boxesGot++;
      chime(720, 0.9, 0.05);
    }
  }
}

// The spider's legs, apart from the chase's rules. updateChase walks it and then
// tests touch and behind; the crush walks it and tests NOTHING, so it keeps
// running while Grimace comes down. It used to stand frozen, and the crush only
// starts once the player has cleared it, so it froze right beside him - under
// a drop 185 units wide.
// How fast the spider runs right now. Its own function because the crush has to
// PREDICT where the spider will be, and a second copy of this formula would be
// free to drift from the one that actually moves it. Same arithmetic as before:
// min(1, clock) is the old (clock - 0) / 1, and it is always 1 by the chase.
function spiderSpeed() {
  return (132 + Math.min(46, (player.x - chaseStartX) / 60)) * Math.min(1, clock);
}

// If Grimace were let go this frame, would the spider be clear of his LANDED
// footprint by the time he got down? Measured to its drawn legs, which hang past
// its 64-unit box, and with the fall time from the same GRIM_G that drops him.
// The frame-by-frame fall lands about a frame sooner than the formula, and
// SPIDER_CLEAR covers that.
const SPIDER_CLEAR = 8;
function spiderClearByLanding() {
  const drop = Math.max(0, (player.y + player.h) - (cam.y - ART.grimace.bh));
  const t = Math.sqrt(2 * drop / GRIM_G);
  const legs = (ART.spider.bw - spider.w) / 2;
  const right = player.x + player.w / 2 + ART.grimace.bw / 2;
  return spider.x - legs + spiderSpeed() * t >= right + SPIDER_CLEAR;
}

function walkSpider(dt) {
  const v = spiderSpeed();
  const was = spider.x;
  spider.x += v * dt;
  const edge = cam.x + SPIDER_EDGE;
  if (spider.x < edge) spider.x = Math.min(edge, spider.x + v * dt);
  spider.anim += spider.x - was;          // legs advance with ground covered, drag included
  // Walk, do not fly. Tracking player.y meant the spider rose with every jump.
  const spiderGround = surfaceBelow(spider.x + spider.w / 2, spider.y);
  spider.base += ((spiderGround - spider.h) - spider.base) * 9 * dt;
  if (spider.lunge > 0) {
    spider.lunge = Math.max(0, spider.lunge - dt);
    spider.lift = LUNGE_UP * Math.sin(Math.PI * (1 - spider.lunge / LUNGE_T));
  } else spider.lift = 0;
  spider.y = spider.base - spider.lift;
  if (Math.random() < 0.02) blip(70 + Math.random() * 40, 0.1, 'sawtooth', 0.05);
}

function updateChase(dt) {
  if (torch.done) return;                 // spider is dead; never re-trigger the chase
  if (!spider.active) {
    if (player.x > chaseTriggerX) {
      spider.active = true;
      chaseStartX = chaseTriggerX;
      // At the left edge of the view, not 240 units back - 240 is past it, so
      // it used to arrive somewhere the player could not see.
      spider.x = cam.x + SPIDER_EDGE; spider.y = player.y;
      spider.base = spider.y; spider.lift = 0; spider.lunge = 0;
      cam.shake = 10; noise(0.5, 0.14); blip(90, 0.5, 'sawtooth', 0.08);
    }
    return;
  }
  if (spider.burn > 0) { spider.burn -= dt; return; }
  if (torch.active) return;

  // The snap: airborne, near, and not already in one. It fires off the player's
  // jump rather than off its own clock, so it is always aimed at him.
  if (spider.lunge <= 0 && !player.grounded &&
      Math.abs((player.x + player.w / 2) - (spider.x + spider.w / 2)) < LUNGE_NEAR) {
    spider.lunge = LUNGE_T;
    blip(150, 0.18, 'sawtooth', 0.07); noise(0.12, 0.08);
  }
  walkSpider(dt);

  if (hit(player, { x:spider.x, y:spider.y, w:spider.w, h:spider.h })) {
    player.x = chaseStartX; player.y = 40; player.vx = 0; player.vy = 0;
    resetChase();
    hits++; cam.shake = 12; noise(0.4, 0.14);
  }
  // Behind it. Tested AFTER the touch above, so clipping it on the way past is a
  // hit and a respawn in front of it, not a death. NOT WHILE HE IS STILL
  // FLASHING from one, either: a respawn puts him at chaseStartX and re-places
  // the spider at the view's near edge, and those two land 166 units apart on
  // this level but only 4 apart if chaseStartX is ever small enough to clamp the
  // camera at 0. Invulnerability is exactly that window, so it is the guard.
  else if (player.invuln <= 0 && player.x + player.w < spider.x) startCrush();
}

// Put the chase back together after a respawn. Two things went wrong without
// this. The camera lerps at 0.16, so a 220-unit teleport left it looking at
// where the player used to be for a third of a second, and a spider placed
// relative to the PLAYER spent that time outside the view. And falling in a
// pit was worse than being caught: the spider kept the x it had, which is
// AHEAD of the respawn point, so it walked off to the right and the chase
// quietly stopped being one. Snap the camera to the player, then put the
// spider back on the near edge of it, on the floor.
function resetChase() {
  cam.x = clamp(player.x + player.w / 2 - VIEW_W / 2, 0, LEVEL_W - VIEW_W);
  spider.x = cam.x + SPIDER_EDGE;
  spider.y = surfaceBelow(spider.x + spider.w / 2, 0) - spider.h;
  spider.base = spider.y; spider.lift = 0; spider.lunge = 0;
}

// He starts above the TOP OF THE VIEW rather than at a fixed height. VIEW_H
// runs 200-420 depending on the device, so a constant would be a long wait on
// a tall screen and already on top of you on a short one.
function startCrush() {
  state = 'crushed'; input.locked = true;
  grim.drop = false; grim.down = false; grim.onFloor = false; grim.t = 0; grim.vy = 0; grim.env = null;
}

// Three beats. WAIT: the player is almost always in the air here - jumping clean
// over the spider is the only way behind it - so he finishes his fall first,
// under the same gravity and collision as any fall, with no input and no
// respawn. DROP: the moment he touches down, Grimace is let go from above the
// top of the view. DOWN: the slam, the cracks, the fart FART_AT later, and the
// sheet once the fart is over - 2.2s after he lands.
// Over a pit there is nothing to touch down on, so the player is stopped just
// below the view and Grimace follows him in: a slam you hear, no cracks.
function updateCrush(dt) {
  grim.t += dt;
  walkSpider(dt);                       // it runs on; it does not get crushed too
  if (!grim.drop) {
    player.vy = Math.min(player.vy + GRAVITY * dt, MAX_FALL);
    moveAndCollide(player, player.vx * dt, player.vy * dt);
    // updatePlayer's clamp, which this copy of its fall first left out. Normal
    // play cannot reach it - the chase starts at x=3360 - but a test with the
    // spider near x=0 walked the player straight off the level and into the
    // pit branch, and a copy of the physics should not quietly differ.
    player.x = clamp(player.x, 0, LEVEL_W - player.w);
    const fell = player.y > LEVEL_H + 40;
    if (fell) { player.y = LEVEL_H + 40; player.vy = 0; }
    if (player.grounded || fell) player.vx = 0;
    // Down, AND the spider out from under him by the time he lands - it runs on,
    // and it started right beside the player. Caught mid-jump that is already
    // true on touchdown, measured 67 units clear; caught standing it was 13.8
    // units UNDER his right edge, so he holds for exactly the beat the spider
    // needs. 2.5s is a backstop against a spider that is not moving, which play
    // cannot produce.
    if ((player.grounded || fell) && (spiderClearByLanding() || grim.t > 2.5)) {
      grim.drop = true; grim.t = 0; grim.vy = 0;
      // Snapped to a canvas pixel: the cracks are cut from a strip centred here,
      // and a fractional centre would blur every column of it.
      grim.x = Math.round((player.x + player.w / 2) * S) / S;
      grim.y = cam.y - ART.grimace.bh;
      blip(300, 0.5, 'sawtooth', 0.05); noise(0.3, 0.2);
    }
  } else if (!grim.down) {
    grim.vy += GRIM_G * dt;
    grim.y += grim.vy * dt;
    if (grim.y >= player.y + player.h) {              // arrived
      grim.y = player.y + player.h; grim.down = true; grim.t = 0;
      grim.onFloor = Math.abs(grim.y - GROUND_Y) < 0.5;
      noise(0.6, 0.3); blip(55, 0.8, 'square', 0.09);
    }
  } else if (!grim.env) {
    if (grim.t >= FART_AT) grim.env = fart();
  } else if (grim.t > FART_AT + fartQuiet + 0.45) {  // the sheet waits for the loud part
    crushed = true;
    showScore();
  }
}

/* The torch-card cutscene, as a phase machine:

     pause   the splash is up and the whole game holds still, clock included
     poof    he appears inside the cloud from the last frame of his dab
     ignite  torch cold at his chest, sweeps up as it lights, held overhead
     run     charges left across the screen to the spider
     burn    braced, flame jet on the spider until it crumples
     back    flame out, runs back to the player
     shake   the handshake
     dab     hit, exhale, and gone into the same cloud he came in on

   Each phase owns its movement and its pose. It used to be a stack of cutT
   thresholds with position checks woven through, and two runs whose length
   depends on where the spider happens to be do not fit that shape. */
// World units of ground per spider walk frame. Its true stride is tiny next to
// its speed - one full 8-frame cycle covers 10.4 units of real travel while it
// chases at 132-178/s - so matching the stride exactly would cycle the legs at
// over 100fps. The manifest's longest legal stride only reaches 12.4 units, so
// the feet slide whatever we do; 7.5 puts the legs at 18-24fps, which reads as
// a hard skitter rather than a strobe.
const SPIDER_STRIDE = 7.5;
// How far in from the left edge of the view the spider is allowed to fall.
// It tops out at 151u/s by the end of the level and MAX_RUN is 160, so a
// player who just holds right outruns it every time - and it spawned 240 units
// back, which is already 58 beyond the edge, so for most of the chase there was
// nothing behind you to see. This drags it forward instead of speeding it up:
// while it is off frame it closes at double speed, which always beats 160, and
// the moment it reaches the edge the drag stops and it is back to its own pace.
// Rate-limited rather than snapped so the gap after a hit is spent, not erased.
// 16, not 6: this runs BEFORE the camera moves, so it clamps against where the
// view was last frame, and at 6 the measured worst case still clipped 9 units
// off the spider's left. Measured over 705 frames of chase at 16: left edge
// never crosses the view at all, right edge never passes the middle.
//
// IT IS ALSO WHAT SETS THE PHONE'S ZOOM, through the DAYLIGHT between the two:
// (VIEW_W/2 - 10) less (SPIDER_EDGE + 64), because the camera centres the
// player and this pins the spider. 102 units at VIEW_W 384, and it falls with
// the view. Measured on 41 layouts: 102, 86 and 70 all finish 41/41 at 0.2
// hits; 62 drops to 40/41 at 3.0; and 54 - VIEW_W 288 with this at 16 -
// collapses to 37/41 at 14.4, one seed taking 111 hits at one spot, the same x
// every time, because the bot stalls at an obstacle and there is no longer room
// to stall in. It is a CLIFF, not a slope, and the lunge has nothing to do with
// it: 288 with LUNGE_NEAR at 0 measures identically.
// So VIEW_W_PHONE is 320, where the daylight is 70 and this can stay at 16 -
// 201/201 at 0.4 hits over 200 seeds, the wide view's own number, with the
// whole spider on the screen. 288 was shipped for one commit with this at -16,
// which bought the daylight back by hanging the spider's back quarter off the
// left edge; being able to see the thing chasing you is worth more than 8
// pixels of character.
const SPIDER_EDGE = 16;
const TORCH_RUN    = 200;   // world units/s, both runs
// World units per run frame: a 6-frame cycle per 69u. With no slip at all the
// planted foot says 7.7u/frame - 39fps of legs at this speed, a blur. Pinning
// the lowest foot to the ground removes the flight phase a real sprinter covers
// with no foot down, so a little glide here is that flight, not a bug.
const TORCH_STRIDE = 11.5 * TORCH_K;
// torch.x = player.x - SHAKE_GAP. Measured, not guessed. His contact hand -
// frame 2, palm down - ends 27.2u right of his centre in the sheet's own scale,
// 27.2 * TORCH_K here, at 50.9u up: 35.0u in the game. The player's frame 12
// holds his palm UP, fingertips 15.3u in front of his centre (player.x - 5.3)
// with the palm's surface near 34u. At this gap torch guy's hand covers the
// player's palm from fingertips to wrist and overlaps its surface by one to
// three units, which is contact once both outlines are drawn - checked on
// screen, not only in this arithmetic.
//
// Height was the part no gap could fix. At the old 41.1u his hand met the
// player's 41.0u exactly - they were the same height. At 70% that became 28.3u
// against 41.0, hand to hip. His shoulder now goes up 40 degrees (make_torchguy
// shake_pose) and the player's arm comes down to sh 63 (rig_export frame 12):
// the shorter man reaches up, the taller reaches down. Neither alone was
// enough - his whole arm straight up only reaches 39.6u.
const SHAKE_GAP    = 27.2 * TORCH_K + 0.5;
// Inferno torch muzzle, from his centre and feet - the tip of the jet the
// sprite itself draws, which is where the particles pick up.
const MUZZLE       = { x: -35 * TORCH_K, y: -45 * TORCH_K };
const TC = { pause: 2.0, poof: 0.6, cold: 0.35, sweep: 0.15, raise: 0.5,
             burn: 1.3, smack: 0.42, shake: 1.15, hit: 0.82, exhale: 0.30, cloud: 1.15 };

function torchPhase(p) { torch.phase = p; torch.pt = 0; }

function startTorchCutscene() {
  state = 'cutscene'; cutT = 0; input.locked = true;
  // PARK THE SPIDER WHERE THE CHASE PARKS IT, which is in frame by
  // construction. It chases at the player's heels, so it has to go back a long
  // way or the torch guy's mark lands on top of him and the two sprites
  // overlap - but the flat 190 units this used to use was measured against a
  // player who sits VIEW_W/2 from the left edge, and VIEW_W is not a constant
  // any more. 190 behind him is 8 units OFF the left edge at VIEW_W 384 and 40
  // off at 320, so the inferno - the one moment the spider is the thing being
  // looked at - played out with a quarter to two thirds of it past the edge.
  // SPIDER_EDGE from the view is where the chase held it all along.
  // A snap rather than a slide, and free: showTorchSplash() covers the screen
  // on this very frame and holds it for TC.pause.
  spider.x = cam.x + SPIDER_EDGE;
  // And stand it on whatever is under the new spot. Nothing re-grounds it
  // during the cutscene - updateChase does not run in this state - so a move
  // without this left it burning in the air, or sunk, wherever the ground it
  // came from was a different height.
  spider.y = surfaceBelow(spider.x + spider.w / 2, 0) - spider.h;
  spider.base = spider.y; spider.lift = 0; spider.lunge = 0;
  // He appears just right of the player and charges left, past him, to the
  // spider. Appearing between them left a run of ~55u - a fifth of a second,
  // too short for a run cycle to register at all.
  torch.x = player.x + player.w + 36;
  // The floor under the player, not the player's feet: the card is often
  // grabbed mid-jump, and he would have appeared standing on air. Snapped to
  // the tile top, because surfaceBelow samples every 2u and returns the first
  // solid sample - up to 2u INTO the floor, so he stood sunk into it.
  torch.y = Math.floor(surfaceBelow(player.x + player.w / 2, player.y + player.h - 1) / TILE) * TILE;
  // His inferno mark: beside the spider, clear of the player - and standing on
  // something. Close enough that the jet the sprite draws ends 5u inside the
  // spider, which is what -5 - MUZZLE.x says; written that way rather than as
  // a measured 30 so shrinking him walks him in instead of leaving him firing
  // short. At this level's torch card the spider gets pinned on the lip of a
  // two-tile pit, and the plain mark put him braced in a planted lunge over
  // thin air, so step right until both planted feet have floor - they sit at
  // -15 and +17 of his own scale from his centre in the inferno frames.
  let mark = spider.x + spider.w - 5 - MUZZLE.x;
  while (mark < player.x - SHAKE_GAP &&
         !(pointSolid(mark - 15 * TORCH_K, torch.y + 1) &&
           pointSolid(mark + 17 * TORCH_K, torch.y + 1))) mark += 2;
  torch.burnX = mark;
  torch.active = false; torch.anim = 0;
  torchPhase('pause');
  showTorchSplash(true);
  chime(1046, 2.0, 0.07);
}

function updateCutscene(dt) {
  cutT += dt; torch.pt += dt;
  if (torch.phase === 'pause') {
    if (torch.pt >= TC.pause) {
      showTorchSplash(false);
      torch.active = true; torchPhase('poof');
      noise(0.35, 0.09);                                     // the puff he arrives in
    }
    return;
  }
  player.vx *= 0.86;
  player.vy = Math.min(player.vy + GRAVITY * dt, MAX_FALL);
  moveAndCollide(player, player.vx * dt, player.vy * dt);

  const burnX  = torch.burnX;                // set once at the start: the spider stays put
  const shakeX = player.x - SHAKE_GAP;
  switch (torch.phase) {
    case 'poof':
      if (torch.pt >= TC.poof) torchPhase('ignite');
      break;
    case 'ignite':
      if (torch.pt >= TC.cold && torch.pt - dt < TC.cold) {   // it lights
        noise(0.22, 0.07); blip(240, 0.14, 'sawtooth', 0.035);
      }
      if (torch.pt >= TC.cold + TC.sweep + TC.raise) torchPhase('run');
      break;
    case 'run':
      torch.x = Math.max(burnX, torch.x - TORCH_RUN * dt);
      torch.anim += TORCH_RUN * dt;
      if (torch.x <= burnX) torchPhase('burn');
      break;
    case 'burn':
      // The jet is art/flame.png now, drawn at the muzzle in render(). What
      // was here was five flat squares a frame in three hard colours, thrown
      // 60-190 units because the drawn flame only covered 15 of the 64 units
      // the spider is wide. They were the last procedural effect on screen
      // besides the truck.
      if (Math.random() < 0.4) noise(0.07, 0.06);
      spider.burn = 1; cam.shake = 4;
      spider.char = clamp((torch.pt - 0.5) / 0.8, 0, 1);    // crumples out by the end of the burn
      if (torch.pt >= TC.burn) torchPhase('back');
      break;
    case 'back':
      torch.x = Math.min(shakeX, torch.x + TORCH_RUN * dt);
      torch.anim += TORCH_RUN * dt;
      if (torch.x >= shakeX) torchPhase('shake');
      break;
    case 'shake':
      // One smack, not a pumped handshake: hand up for TC.smack, then down on
      // the player's palm and held there. The sound is the contact, so it fires
      // on the crossing rather than every frame after it.
      if (torch.pt >= TC.smack && torch.pt - dt < TC.smack) {
        noise(0.06, 0.10); blip(180, 0.08, 'square', 0.03);
      }
      if (torch.pt >= TC.shake) torchPhase('dab');
      break;
    case 'dab':
      if (torch.pt >= TC.hit + TC.exhale + TC.cloud) {
        noise(0.3, 0.07);                                    // gone, same puff
        spider.active = false; torch.active = false; torch.done = true;
        noise(0.8, 0.05);                                    // the unit opening, off screen
        torchPhase('none');
        state = 'play'; input.locked = false;
        chime(784, 1.6, 0.06); setTimeout(function(){ chime(1176, 2.2, 0.06); }, 120);
      }
      break;
  }
}

// Which torchguy frame to draw, whether to mirror it, and at what opacity.
// Facing is per frame and is set by the drawing, not by the scene: run and
// inferno are drawn facing LEFT (at the spider) so they draw straight; the
// return run mirrors the flame-out run frames to face right; the handshake is
// drawn facing RIGHT (at the player). See the FRAMES table in make_torchguy.py.
function torchGuyPose() {
  const t = torch.pt, runF = Math.floor(torch.anim / TORCH_STRIDE) % 6;
  switch (torch.phase) {
    case 'poof':   return { f:5, flip:false, a:Math.min(1, t / 0.2) };           // the cloud rolls in
    case 'ignite': return { f: t < TC.cold ? 6 : t < TC.cold + TC.sweep ? 7 : 0, flip:false };
    case 'run':    return { f:8 + runF, flip:false };
    case 'burn':   return { f: Math.floor(t * 12) % 2 ? 14 : 1, flip:false };    // jet flicker
    case 'back':   return { f:16 + runF, flip:true };
    case 'shake':  return { f: t < TC.smack ? 15 : 2, flip:false };             // up, then down once
    case 'dab':
      if (t < TC.hit) return { f:3, flip:false };                                // takes the hit
      if (t < TC.hit + TC.exhale) return { f:4, flip:false };                    // exhales
      return { f:5, flip:false, a:Math.min(1, (TC.hit + TC.exhale + TC.cloud - t) / 0.35) };
  }
  return { f:6, flip:false };
}

// The player's half of the handshake: frame 12, hand out, turned to face him.
function playerShaking() { return state === 'cutscene' && torch.phase === 'shake'; }

function computeScore() {
  const boxPts  = boxesGot * SCORE.box;
  const cardPts = cardsGot * SCORE.card;
  // A run that ended under Grimace banks no time: it did not finish early, it
  // did not finish. Otherwise being crushed in the first seconds paid the most.
  const timePts = crushed ? 0 : Math.max(0, Math.round((PAR_TIME - clock) * SCORE.perSecond));
  const cleanPts = (hits === 0 && !crushed) ? SCORE.clean : 0;   // being crushed is not clean
  finalScore = boxPts + cardPts + timePts + cleanPts + bonusPts;
  // ceil, so 0.90 of 42 is 38 and not 37: a fraction that lands between two
  // boxes has to round AWAY from the player, or the bar sits below the number
  // printed on the sheet.
  grade = 'C';
  for (let i = 0; i < GRADES.length; i++) {
    const g = GRADES[i];
    if (boxesGot >= Math.ceil(g.boxes * TOTAL_BOXES) &&
        cardsGot >= Math.ceil(g.cards * TOTAL_CARDS) &&
        hits <= g.hits) { grade = g.letter; break; }
  }
  return { boxPts, cardPts, timePts, cleanPts };
}

function update(dt) {
  if (state === 'score') return;

  if (state === 'crushed') { updateCrush(dt); updateCamera(dt); return; }

  if (state === 'ending') {
    endT += dt;
    player.vx = 120; player.face = 1;
    player.vy = Math.min(player.vy + GRAVITY * dt, MAX_FALL);
    moveAndCollide(player, player.vx * dt, player.vy * dt);
    if (endT > 1.6) showScore();
    cam.x = clamp(player.x + player.w/2 - VIEW_W/2, 0, LEVEL_W - VIEW_W);
    const mY = LEVEL_H - VIEW_H;
    cam.y = mY <= 0 ? mY : clamp(player.y + player.h/2 - VIEW_H * 0.42, 0, mY);
    return;
  }

  // The splash is a pause, so it pauses everything: no clock, no pickups, no
  // camera. Only the splash timer inside updateCutscene moves.
  if (state === 'cutscene' && torch.phase === 'pause') { updateCutscene(dt); return; }

  clock += dt;

  if (state === 'cutscene') { updateCutscene(dt); }
  else {
    updatePlayer(dt);
    updateEnemies(dt);
    updateChase(dt);
  }
  updatePickups(dt);
  updateStomps(dt);

  if (gateBump > 0) gateBump -= dt;
  if (state === 'play' && !gateShut() && player.x > exitX) { state = 'ending'; endT = 0; input.locked = true; }

  updateCamera(dt);
}

// Follow the player and wind any shake down. Its own function because the crush
// needs it as well: that state used to return from update() before this ran,
// which froze the camera where the player jumped from and froze cam.shake at
// 22 - measured, still 22 five seconds after the sheet came up, so the screen
// jittered behind CRUSHED until RUN IT BACK. And with the player now finishing
// his fall before Grimace drops, a frozen camera let him drift off the left
// edge first, so the whole thing landed out of view.
function updateCamera(dt) {
  const target = clamp(player.x + player.w/2 - VIEW_W/2, 0, LEVEL_W - VIEW_W);
  cam.x += (target - cam.x) * 0.16;
  const maxY = LEVEL_H - VIEW_H;         // negative when the view is taller than the level
  if (maxY <= 0) cam.y = maxY;           // floor pinned to the bottom, ceiling fills above
  // 0.42, not 0.58: this anchor decides whether an ordinary jump MOVES the
  // camera. Pinned at the bottom the view starts at LEVEL_H - VIEW_H, and the
  // target only lifts off that once VIEW_H * (1 - k) falls under 134.5 - how
  // far a floor jump's apex is above the bottom of the level. At 0.58 with
  // VIEW_H 240 that is 100.8 against 134.5, so every jump from flat ground
  // dragged the camera up some 30 units and let it fall back. At 0.42 it is
  // 139.2 and the camera holds still until the player actually climbs.
  else cam.y += (clamp(player.y + player.h/2 - VIEW_H * 0.42, 0, maxY) - cam.y) * 0.10;
  if (cam.shake > 0) cam.shake = Math.max(0, cam.shake - dt * 22);
  // THE CUTSCENE MUST NOT SCROLL PAST THE SPIDER. It is the thing being looked
  // at for the whole inferno, and parking it in frame when the card is grabbed
  // is not enough on its own: the player keeps drifting right for a moment
  // after that (vx decays 0.86 a frame, ~19 units), and the camera was already
  // lagging him by ~17, so the view carried ~33 units on and left 17 of the
  // spider's 64 past the left edge by the time the jet lit - measured, on all
  // 41 layouts and at both view widths. This holds the camera where the park
  // put it. It can only ever stop the view moving RIGHT, never pull it left:
  // at the park spider.x - SPIDER_EDGE IS cam.x.
  if (state === 'cutscene')
    cam.x = clamp(Math.min(cam.x, spider.x - SPIDER_EDGE), 0, LEVEL_W - VIEW_W);
}

/* ==========================================================================
   11. PROCEDURAL PLACEHOLDER ART
       Every one of these is replaced the moment the matching PNG loads.
   ========================================================================== */
function px(x, y, w, h, col) { ctx.fillStyle = col; ctx.fillRect(Math.round(x), Math.round(y), w, h); }

// Placeholder drawn in CANVAS PIXELS (~60 x 171 at S=3), not in world units.
// That is the same budget art/player.png gets. Drawing in world units capped
// every feature at a 3px block and used about 5% of the available pixels —
// the engine was never the limit on character detail.
// Origin is feet-centre, facing right; the caller mirrors for left.
function drawHeroHD(phase, airborne, rising) {
  const q = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); };
  const K='#17171b', DK='#0d0d10', TEE='#1e1e25', SK='#d2a07c', SH='#b0805c',
        PA='#6b675c', PS='#56534a', RD='#b8362a', PP='#e8e2d6', HR='#241c18';

  let a, b, lift;
  if (airborne) { a = rising ? -12 : -6; b = rising ? 12 : 8; lift = rising ? 12 : 5; }
  else { const sw = Math.sin(phase) * 11; a = -sw; b = sw; lift = 0; }

  // back leg
  q(-11 + a, -76, 19, 58, PS);
  q(-13 + a, -22, 25, 15, DK);
  q(-13 + a, -7,  26, 7,  PP);
  // front leg + cargo pocket
  q(-9 + b, -76, 20, 58 - lift, PA);
  q(-7 + b, -62, 14, 23, PS);
  q(-7 + b, -41, 14, 2, '#4c493f');
  q(-11 + b, -22 - lift, 26, 15, K);
  q(-11 + b, -22 - lift, 26, 3, '#34343c');
  q(-11 + b, -7  - lift, 27, 7,  PP);

  // torso
  q(-20, -128, 42, 52, TEE);
  q(-22, -126, 6, 46, '#111116');          // back fold
  q(-20, -128, 42, 4, '#282830');          // collar
  q(2, -114, 15, 27, RD);                  // shirt graphic
  q(5, -108, 5, 14, PP);
  q(5, -91, 10, 3, PP);
  q(-20, -80, 42, 5, '#0f0f13');           // hem
  q(-19, -79, 39, 7, '#3b382f');           // belt
  q(-2, -79, 7, 7, '#8f8460');             // buckle

  // forward arm
  const sa = airborne ? -8 : Math.sin(phase + Math.PI) * 9;
  q(-6 + sa, -126, 17, 29, TEE);           // short sleeve
  q(-6 + sa, -99, 17, 3, '#111116');       // cuff
  q(-4 + sa, -96, 14, 22, SK);             // forearm
  q(-5 + sa, -78, 15, 10, SH);             // hand

  // head
  q(-14, -156, 31, 28, SK);
  q(17, -147, 8, 9, SK);                   // nose
  q(-16, -152, 6, 17, HR);                 // hair at the nape
  q(-3, -144, 6, 7, SH);                   // ear
  q(2, -131, 14, 3, SH);                   // jaw shadow
  q(-3, -150, 25, 9, DK);                  // sunglasses
  q(1, -148, 7, 3, '#414852');             // lens glint
  q(-14, -148, 11, 3, DK);                 // temple arm

  // cap
  q(-16, -171, 36, 17, K);
  q(-16, -171, 36, 4, '#282830');
  q(16, -159, 22, 6, K);                   // brim
  q(16, -159, 22, 2, '#282830');
  q(-2, -169, 7, 5, '#30303a');            // panel seam
}

function drawRat(e) {
  const x = Math.round(e.x - cam.x), y = Math.round(e.y);
  const bob = Math.floor(e.anim) % 2;
  px(x, y + 2 + bob, 20, 10, '#6b5f55');
  px(x + (e.vx > 0 ? 15 : 1), y + bob, 5, 5, '#7d7066');
  px(x + (e.vx > 0 ? 18 : 1), y + 2 + bob, 2, 2, C.hot);
  px(x + (e.vx > 0 ? -4 : 20), y + 7 + bob, 5, 2, '#8a7d72');
}
function drawRoach(e) {
  const x = Math.round(e.x - cam.x), y = Math.round(e.y);
  const bob = Math.floor(e.anim) % 2;
  px(x, y + 2, 16, 8, '#4a3524');
  px(x + 2, y + 3, 12, 3, '#6b4c33');
  px(x + (e.vx > 0 ? 14 : -3), y + bob, 4, 2, '#3a2a1c');
}
function drawSpider(sx, sy, burning) {
  const bob = Math.sin(clock * 9) * 2;
  const body = burning ? (Math.floor(clock * 22) % 2 ? C.hot : C.spider) : C.spider;
  for (let i = 0; i < 4; i++) {                              // legs
    const lx = sx + 6 + i * 12, sw = Math.sin(clock * 11 + i) * 4;
    px(lx, sy + 8 + bob, 3, 22 + sw, C.spiderHi);
    px(lx + 26, sy + 8 + bob, 3, 22 - sw, C.spiderHi);
  }
  px(sx + 8, sy + 6 + bob, 38, 24, body);                    // abdomen
  px(sx + 12, sy + 10 + bob, 30, 8, C.spiderHi);
  px(sx + 40, sy + 12 + bob, 14, 14, body);                  // head
  px(sx + 46, sy + 15 + bob, 3, 3, C.hot);                   // eyes
  px(sx + 51, sy + 15 + bob, 3, 3, C.hot);
}
function drawTorchGuy(x, y) {
  const L = x - 10, T = y - 40;
  px(L + 2, T + 36, 16, 4, C.ink);
  px(L + 4, T + 22, 12, 15, '#3f4d5c');                      // work pants
  px(L + 3, T + 9, 14, 14, '#c9803a');                       // hi-vis jacket
  px(L + 3, T + 14, 14, 3, C.paper);                         // reflective stripe
  px(L + 5, T + 1, 11, 9, C.skin);
  px(L + 4, T, 13, 4, '#f2c744');                            // hard hat
  px(L - 8, T + 16, 10, 4, '#8f9499');                       // torch body
  px(L - 12, T + 17, 5, 2, '#5f6469');                       // nozzle
}
function drawBox(x, y, s) {
  const h = s || 26;
  px(x - h/2, y - h/2, h, h, C.card1);
  px(x - h/2, y - h/2, h, 3, C.card2);
  px(x - h/2, y + h/2 - 3, h, 3, C.card3);
  px(x - 2, y - h/2, 4, h, C.card2);                         // tape seam
}
function drawCard(x, y, torchCard) {
  const w = Math.abs(Math.cos(clock * 3)) * 14 + 2;
  px(x - w/2, y - 11, w, 22, torchCard ? '#f2c744' : C.paper);
  if (w > 8) {
    px(x - w/2 + 2, y - 8, w - 4, 8, torchCard ? C.hot : C.trim);
    px(x - w/2 + 2, y + 2, w - 4, 2, torchCard ? '#8c3a10' : '#9aa0a6');
  }
}

/* ==========================================================================
   12. RENDER
   ========================================================================== */
const BG_PARALLAX = 0.55;              // the wall scrolls at this fraction of the camera
// Where the centre of the open bay sits in wall space. Solving
//     open_x - cam*P = exitX - cam
// at the camera's final resting position (it clamps against the end of the
// level) puts the doorway over the exit as the player walks into it. Anchored
// on the exit, not on TRUCK_X: at that camera the truck's own world position is
// already past the right edge of the screen, so a bay pinned to it never shows.
// VIEW_W is in it and VIEW_W is picked per screen shape, so this is worked out
// again on every resize() rather than once at load.
function openBayX() { return exitX - (LEVEL_W - VIEW_W) * (1 - BG_PARALLAX); }
let BG_OPEN_X = openBayX();

let pitShade = null;               // built on first use; see the pits, in render()
const bgSeedDoors = [];
for (let i = 0; i < 24; i++) bgSeedDoors.push(i * 300 + 60);

function render() {
  ctx.setTransform(S, 0, 0, S, 0, 0);   // canvas space
  const shake = cam.shake > 0 ? (Math.random() - 0.5) * cam.shake : 0;
  // Grimace's landing is a SLAM, not the game's usual sideways jitter: a hit
  // knocks the view aside, a landing this heavy drops it. A damped vertical
  // bounce - 10 units times exp(-4.5t), which draws 8.3 at most because its
  // first peak falls between frames, and is 10% of that by 0.5s - with a little
  // random sideways under the same envelope. It is a function of grim.t, which
  // stops advancing once the sheet is up, and it is over by 1.3s, so unlike
  // cam.shake it has nothing that can be left running. It decayed at 7/s, 3% by
  // 0.5s; at 4.5 it is still bouncing when the fart takes over at FART_AT.
  // Then the RUMBLE: jitter both ways, up to 3.5 units, scaled frame by frame by
  // the fart's own loudness (grim.env), so it swells, sputters and stops with
  // the sound. It is keyed off grim.t as well, so the same freeze ends it.
  let slamX = 0, slamY = 0;
  if (grim.down && (state === 'crushed' || crushed)) {
    if (grim.t < 1.3) {
      const e = Math.exp(-grim.t * 4.5);
      slamY = Math.sin(grim.t * 55) * 10 * e;
      slamX = (Math.random() - 0.5) * 7 * e;
    }
    const k = grim.env ? grim.env[Math.floor((grim.t - FART_AT) * 60)] || 0 : 0;
    slamX += (Math.random() - 0.5) * 7 * k;
    slamY += (Math.random() - 0.5) * 7 * k;
  }
  const cx = Math.round(cam.x + shake + slamX);
  const cy = Math.round(cam.y + slamY);

  // --- backdrop in CANVAS space: wall and ceiling always fill the view
  px(0, 0, VIEW_W, VIEW_H, C.wall);
  // Pinned to the top of the SCREEN, which is why it only stays as the
  // fallback: VIEW_H runs 200-420 against a 336-unit level, so a ceiling here
  // sits at a different height on every device. bg_upper.png is anchored to
  // the level instead - see the wall block below.
  if (!(ART.bgUpper.ready && ART.bgClosed.ready)) {
    px(0, 0, VIEW_W, 30, C.ceil);
    for (let i = 0; i < 9; i++) px(i * 48 + 6, 30, 6, 14, C.ceil);   // roof trusses
    px(0, 44, VIEW_W, 3, C.deep);                                    // conduit run
    for (let i = -1; i < 6; i++) {                                   // fluorescent fixtures
      const lx = Math.round(((i * 150 + 40 - cx * 0.8) % 750 + 750) % 750) - 150;
      px(lx + 20, 30, 2, 12, C.ceil);                                // hanger cords
      px(lx + 52, 30, 2, 12, C.ceil);
      px(lx, 42, 74, 6, C.lamp);
      px(lx + 4, 48, 66, 3, 'rgba(238,243,247,.18)');
    }
    for (let i = 0; i < 8; i++) {                                    // wall panel seams
      const sx = Math.round(((i * 96 - cx * 0.55) % 768 + 768) % 768) - 96;
      px(sx, 47, 1, VIEW_H, C.wallHi);
    }
  }

  // --- everything below is in WORLD space and scrolls with the camera
  ctx.setTransform(S, 0, 0, S, 0, -cy * S);

  // --- the wall. Drawn storage-unit art, tiled the length of the level at the
  // same 0.55 parallax the blocked-in doors used, with the open bay dropped on
  // top of one tile at the end. Each tile's top row IS C.wall (baked in by
  // tools/make_bg.py), so the fill above joins it with no seam, and its own
  // wainscot replaces the blue trim line.
  const bgc = ART.bgClosed;
  if (bgc.ready) {
    const bw = bgc.img.width / S, bh = bgc.img.height / S;
    const off = cx * BG_PARALLAX;
    // Both edges of every tile rounded to CANVAS PIXELS, and the tile drawn
    // exactly that wide. The tiles are 159.33 units, and rounding only the
    // left edge to a whole unit - as this used to - started every other tile
    // up to a unit late: a two-pixel gap down that seam, with the flat wall
    // fill showing through as a light line from the roof to the floor.
    const edgeX = function (i, w) { return Math.round((i * w - off) * S) / S; };
    // Everything above the doors: roof, then the ceiling strip. Same width
    // and parallax as the door tiles and the same i * width - off grid, so the
    // strip's pillars stand over the doors' grey columns, and its bottom edge
    // sits on the doors' top edge - both rows are WALL, so there is no seam.
    // It reaches 84 units above the level. Nothing shows that now - VIEW_H_MAX
    // is under the level's own height - so the top of that art is spare.
    const bgu = ART.bgUpper;
    if (bgu.ready) {
      const uw = bgu.img.width / S, uh = bgu.img.height / S;
      for (let i = Math.floor(off / uw); i * uw - off < VIEW_W; i++) {
        const a = edgeX(i, uw);
        ctx.drawImage(bgu.img, a, GROUND_Y - bh - uh, edgeX(i + 1, uw) - a, uh);
      }
    }
    for (let i = Math.floor(off / bw); i * bw - off < VIEW_W; i++) {
      const a = edgeX(i, bw);
      ctx.drawImage(bgc.img, a, GROUND_Y - bh, edgeX(i + 1, bw) - a, bh);
    }
    const bgo = ART.bgOpen;
    const ox = Math.round(BG_OPEN_X - bw / 2 - off);
    if (bgo.ready && !gateShut()) {
      // Pinned so the open doorway sits exactly behind the truck once the
      // camera has run up against the end of the level. At parallax the wall
      // drifts against the world, so this can only line up at one camera
      // position - that one, the one the player finishes at.
      if (ox > -bw && ox < VIEW_W) ctx.drawImage(bgo.img, ox, GROUND_Y - bh, bw, bh);
    }
    // The padlock, on the door the bay will replace. Drawn in WALL space off
    // the same `off` as the tiles, not in world space: the wall slides against
    // the world at parallax, and a world-space lock slid 43 units across the
    // door over the last stretch of the approach instead of hanging on it.
    if (gateShut() && ox > -bw && ox < VIEW_W) {
      const lx = Math.round(ox + bw / 2), ly = GROUND_Y - 58;
      px(lx - 11, ly - 3, 22, 6, C.deep);              // hasp across the slats
      px(lx - 10, ly - 2, 20, 3, C.wallHi);
      px(lx - 4, ly + 2, 8, 6, C.deep);                // shackle
      px(lx - 3, ly + 3, 6, 4, C.wallHi);
      px(lx - 7, ly + 6, 14, 11, C.deep);              // body
      px(lx - 6, ly + 7, 12, 9, C.gold);
      px(lx - 1, ly + 10, 2, 4, C.deep);               // keyhole
    }
  } else {
    for (let r = 0; r < 2; r++) {                             // high racking, decorative
      const ry = 96 + r * 76;
      for (let i = 0; i < 20; i++) {
        const bx = Math.round(i * 124 - cx * 0.55);
        if (bx > VIEW_W || bx + 112 < 0) continue;
        // 1px dark edges, so the background reads in the same outlined style
        // as the sprites instead of as flat blocked-in colour behind them.
        px(bx + 5, ry - 25, 34, 26, C.deep);
        px(bx + 6, ry - 24, 32, 24, C.card3);
        px(bx + 45, ry - 20, 30, 21, C.deep);
        px(bx + 46, ry - 19, 28, 19, C.card3);
        px(bx + 79, ry - 28, 28, 29, C.deep);
        px(bx + 80, ry - 27, 26, 27, C.card3);
        px(bx, ry, 112, 6, C.deep);
        px(bx, ry, 112, 5, C.wood);
        px(bx + 8, ry + 5, 4, 14, C.wood);
        px(bx + 100, ry + 5, 4, 14, C.wood);
      }
    }
    for (let i = 0; i < bgSeedDoors.length; i++) {            // roll-up doors, parallax 0.55
      const dx = Math.round(bgSeedDoors[i] - cx * 0.55);
      if (dx > VIEW_W || dx + 150 < 0) continue;
      px(dx - 1, 175, 152, 128, C.deep);              // door frame edge
      px(dx, 176, 150, 12, C.doorLo);
      px(dx + 4, 188, 142, 114, C.doorMid);
      for (let sl = 0; sl < 14; sl++) px(dx + 4, 192 + sl * 8, 142, 2, C.doorLo);
      px(dx + 4, 188, 142, 2, C.doorHi);
      px(dx + 112, 246, 18, 5, C.wallHi);
    }
    px(0, GROUND_Y - 10, VIEW_W, 10, C.trim);                 // blue wall trim at floor line
  }

  // --- tiles
  for (let i = 0; i < tiles.length; i++) {
    const t = tiles[i], x = Math.round(t.x - cx);
    if (x > VIEW_W || x + TILE < 0) continue;
    if (t.t === '#' && t.y >= GROUND_Y) {                     // the floor itself
      const fl = ART.bgFloor;
      if (fl.ready) {
        // Sampled by WORLD x rather than drawn whole per tile, so the concrete
        // repeats every fl.img.width / S units whatever the tile grid does - a
        // pit cuts it cleanly and there is no 24-unit pattern to spot. The
        // image is its own mirror image side by side, so the wrap has no seam.
        const tw = fl.img.width / S, u = ((t.x % tw) + tw) % tw;
        ctx.drawImage(fl.img, u * S, 0, TILE * S, fl.img.height, x, t.y, TILE, TILE);
      } else {
        px(x, t.y, TILE, TILE, C.floor);
        px(x, t.y, TILE, 2, C.floorHi);
        px(x + 5, t.y + 9, 3, 1, C.floorHi);
        px(x + 15, t.y + 16, 4, 1, C.floorHi);
      }
    } else if (t.t === '#') {
      // Stacked cardboard: art/bg_boxwall.png, a box drawn face-on, one per
      // tile. Face-on rather than the pickup's three-quarter crate, because a
      // wall of three-quarter crates is a wall of diamond holes; this one fills
      // its tile except for a small bevel at each top corner. Not mirrored on a
      // checker - it is lit from one side, and flipping every other box would
      // light the wall from both. The blocked-in version stays for when the art
      // is missing.
      const bxw = ART.bgBoxWall;
      if (bxw.ready) {
        // The bevels are the only gaps. C.cardDeep fills them only on the sides
        // where this tile touches another box, so the outside of a stack keeps
        // its bevelled corners instead of squaring off against a dark block.
        const bl = t.nL ? 0 : 2, br = t.nR ? 0 : 2,
              bu = t.nU ? 0 : 2, bd = t.nD ? 0 : 2;
        px(x + bl, t.y + bu, TILE - bl - br, TILE - bu - bd, C.cardDeep);
        ctx.drawImage(bxw.img, x, t.y, TILE, TILE);
      } else {
        px(x, t.y, TILE, TILE, C.deep);             // edge, reads as stacked boxes
        px(x + 1, t.y + 1, TILE - 2, TILE - 2, C.card1);
        px(x + 1, t.y + 1, TILE - 2, 2, C.card2);
        px(x + 1, t.y + TILE - 4, TILE - 2, 2, C.card3);
        px(x + 10, t.y + 1, 4, TILE - 2, C.card2);
      }
    } else if (!ART.rackDeck.ready) {              // a shelf, when the rack art is missing
      px(x, t.y, TILE, 11, C.deep);                 // shelf edge
      px(x, t.y, TILE, 4, C.woodHi);
      px(x, t.y + 4, TILE, 6, C.wood);
      px(x + 2, t.y + 6, 3, 4, '#6b5330');
      px(x + 17, t.y + 6, 3, 4, '#6b5330');
    }
  }

  // --- the shelves, as racks: after the floor, which would cover the front
  // feet, and lowest first. Everything is placed in whole CANVAS pixels - the
  // deck image is 62 px, 20.67 units, so in units nothing lands on the grid.
  if (ART.rackDeck.ready) {
    const dk = ART.rackDeck, lg = ART.rackLegs;
    const dw = dk.img.width / dk.n, dh = dk.img.height;
    const lw = lg.ready ? lg.img.width / lg.n : 0, lh = lg.ready ? lg.img.height : 0;
    for (let i = 0; i < racks.length; i++) {
      const rk = racks[i];
      if (rk.x - cx > VIEW_W || rk.x + rk.w - cx < 0) continue;
      const left = (rk.x - cx) * S, right = (rk.x + rk.w - cx) * S;   // canvas px, whole
      if (lg.ready) {
        // Cropped from the BOTTOM: the feet and the brace are always drawn, and
        // the cut is at the top, under the deck.
        const top = Math.round((rk.y + RACK.legTop) * S);
        for (let side = 0; side < 2; side++) {
          const bottom = Math.round(((side ? rk.footR : rk.footL) + RACK.ground) * S);
          const len = Math.min(bottom - top, lh);
          const lx = side ? right - lw : left;
          ctx.drawImage(lg.img, side * lw, lh - len, lw, len, lx / S, (bottom - len) / S, lw / S, len / S);
        }
      }
      // The deck: left end, then the middle until the right end. The last
      // middle copy is cut short against the right end - at 30, 40 or 50 px for
      // a 3, 4 or 5 tile shelf - so make_rack.py keeps the middle's rivet
      // inside its first 30 px, or a cut through it shows.
      const dy = rk.y - RACK.feet, stop = right - dw;
      ctx.drawImage(dk.img, 0, 0, dw, dh, left / S, dy, dw / S, dh / S);
      for (let mx = left + dw; mx < stop; mx += dw) {
        const w = Math.min(dw, stop - mx);
        ctx.drawImage(dk.img, dw, 0, w, dh, mx / S, dy, w / S, dh / S);
      }
      ctx.drawImage(dk.img, 2 * dw, 0, dw, dh, stop / S, dy, dw / S, dh / S);
    }
  }

  // --- the pits go dark. One gradient, transparent at the floor line and black
  // by the bottom of the level, filled over every run of missing floor - so a
  // pit reads as a hole rather than as a window onto the backdrop. Drawn after
  // the racks, so a leg standing in one fades into it. The gradient is built
  // once: its coordinates are in world units and the camera's transform is what
  // puts them on screen, so it follows the view on its own.
  if (!pitShade) {
    pitShade = ctx.createLinearGradient(0, GROUND_Y, 0, LEVEL_H);
    pitShade.addColorStop(0, 'rgba(0,0,0,0)');
    pitShade.addColorStop(0.55, 'rgba(0,0,0,0.72)');
    pitShade.addColorStop(1, 'rgba(0,0,0,1)');
  }
  ctx.fillStyle = pitShade;
  for (let i = 0; i < pits.length; i++) {
    const pt = pits[i], px0 = pt.x - cx;
    if (px0 > VIEW_W || px0 + pt.w < 0) continue;
    ctx.fillRect(px0, GROUND_Y, pt.w, LEVEL_H - GROUND_Y);
  }

  // --- exit door marker. The open bay in the wall art is the exit now; this
  // is the placeholder for when that art is missing.
  const ex = Math.round(exitX - cx);
  if (!ART.bgOpen.ready && ex < VIEW_W + 60 && ex > -60) {
    if (gateShut()) {
      // Shut, in the same palette and the same 8-unit slat pitch as the
      // procedural doors along the fallback wall, so it reads as one of them.
      px(ex - 1, GROUND_Y - 119, 48, 119, C.deep);
      px(ex, GROUND_Y - 118, 46, 12, C.doorLo);
      px(ex, GROUND_Y - 106, 46, 106, C.doorMid);
      for (let sl = 0; sl < 13; sl++) px(ex, GROUND_Y - 104 + sl * 8, 46, 2, C.doorLo);
      px(ex, GROUND_Y - 106, 46, 2, C.doorHi);
      px(ex + 16, GROUND_Y - 60, 14, 5, C.deep);
      px(ex + 17, GROUND_Y - 59, 12, 3, C.gold);       // the same padlock, smaller
    } else {
      px(ex, GROUND_Y - 118, 46, 118, C.deep);
      px(ex, GROUND_Y - 118, 46, 5, C.doorHi);
      px(ex + 4, GROUND_Y - 110, 38, 4, 'rgba(238,243,247,.30)');
    }
  }

  // --- the truck, backed into the bay at the end of the unit.
  // The open bay in the wall art already has a truck backed into it, so the
  // sprite would be a second one parked in front of the first. It stays as the
  // fallback for when that art is missing.
  if (state !== 'ending' && state !== 'score' && !ART.bgOpen.ready) {
    const twx = Math.round(TRUCK_X + 85 - cx);
    if (twx > -180 && twx < VIEW_W + 180) sprite('truck', 0, twx, GROUND_Y, false);
  }

  // --- pickups
  for (let i = 0; i < boxes.length; i++) {
    const b = boxes[i]; if (b.got) continue;
    const x = Math.round(b.x - cx); if (x > VIEW_W + 20 || x < -20) continue;
    const bob = Math.sin(clock * 3 + b.x * 0.05) * 1.5;
    if (!sprite('box', 0, x, b.y + 10 + bob, false)) drawBox(x, b.y + bob);
  }
  for (let i = 0; i < loose.length; i++) {
    const l = loose[i], x = Math.round(l.x - cx);
    if (!sprite('box', 0, x, l.y + 8, false)) drawBox(x, l.y, 20);
  }
  for (let i = 0; i < cards.length; i++) {
    const c = cards[i]; if (c.got) continue;
    const x = Math.round(c.x - cx); if (x > VIEW_W + 20 || x < -20) continue;
    const bob = Math.sin(clock * 4 + c.x * 0.03) * 2;
    const cf = c.design * 4 + Math.floor(clock * 8) % 4;
    if (!sprite('card', cf, x, c.y + 11 + bob, false)) drawCard(x, c.y + bob, c.torch);
  }

  // --- enemies
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    const x = Math.round(e.x - cx); if (x > VIEW_W + 30 || x < -30) continue;
    if (e.dead > 0) { px(x, e.y + e.h - 3, e.w, 3, '#4a3524'); continue; }
    const key = e.kind === 'rat' ? 'rat' : 'roach';
    if (!sprite(key, Math.floor(e.anim) % 4, x + e.w/2, e.y + e.h, e.vx < 0)) {
      e.kind === 'rat' ? drawRat(e) : drawRoach(e);
    }
  }

  // --- spider
  if (spider.active && spider.char < 1) {
    const sx = Math.round(spider.x - cx);
    if (sx < VIEW_W + 80 && sx > -100) {
      ctx.save();
      // Frames 8-11 are the rig's own collapse - legs folding under a sinking
      // body - so the burn plays those instead of squashing the walk frame.
      // Only the last of it fades, or he would vanish before he finished dying.
      let sf = Math.floor(spider.anim / SPIDER_STRIDE) % 8;
      if (spider.char > 0) {
        sf = 8 + Math.min(3, Math.floor(spider.char * 4));
        ctx.globalAlpha = 1 - Math.max(0, (spider.char - 0.7) / 0.3);
      }
      if (!sprite('spider', sf, sx + spider.w/2, spider.y + spider.h + 2, false)) {
        ctx.save(); ctx.translate(sx, spider.y); ctx.scale(1.25, 1.25);
        drawSpider(0, 0, spider.burn > 0); ctx.restore();
      }
      ctx.restore();
    }
  }

  // --- torch guy + flames
  if (torch.active) {
    const tx = Math.round(torch.x - cx);
    const tp = torchGuyPose();
    ctx.save();
    if (tp.a != null) ctx.globalAlpha = Math.max(0, Math.min(1, tp.a));
    if (!sprite('torchguy', tp.f, tx, torch.y, tp.flip)) {
      ctx.save(); ctx.translate(tx, torch.y); ctx.scale(HERO * TORCH_K, HERO * TORCH_K);
      drawTorchGuy(0, 0); ctx.restore();
    }
    ctx.restore();
    // The jet hangs its RIGHT edge on the muzzle, centred on the muzzle's own
    // height. MUZZLE.x is already negative - ahead of him is to the LEFT, the
    // way the sheet is drawn - so there is nothing to mirror. Both edges are
    // snapped to canvas pixels, as sprite() does, or the jet shimmers against
    // a man who does not.
    if (torch.phase === 'burn' && ART.flame.ready) {
      const fa = ART.flame, fw = fa.img.width / fa.n;
      const f = Math.floor(torch.pt * 18) % fa.n;
      ctx.drawImage(fa.img, f * fw, 0, fw, fa.img.height,
                    Math.round((tx + MUZZLE.x - fa.bw) * S) / S,
                    Math.round((torch.y + MUZZLE.y - fa.bh / 2) * S) / S,
                    fa.bw, fa.bh);
    }
  }

  // --- player. Once Grimace is down the player is underneath him.
  if (!(player.invuln > 0 && Math.floor(clock * 20) % 2) && !grim.down) {
    const pxc = Math.round((player.x + player.w/2 - cx) * S) / S,
          pby = Math.round((player.y + player.h) * S) / S;
    let f = 0, faceLeft = player.face < 0;
    if (playerShaking()) { f = 12; faceLeft = true; }      // torch guy is on his left
    else if (!player.grounded) f = player.vy < 0 ? 10 : 11;
    else if (Math.abs(player.vx) > 12) f = 2 + (Math.floor(player.anim) % 8);
    else f = Math.floor(clock * 2) % 2;
    if (!sprite('player', f, pxc, pby, faceLeft)) {
      ctx.save();
      ctx.translate(pxc, pby);
      ctx.scale(1 / S, 1 / S);                       // 1 unit = 1 canvas pixel
      if (player.face < 0) ctx.scale(-1, 1);
      drawHeroHD(player.anim * 0.85, !player.grounded, player.vy < 0);  // anim rate doubled above
      ctx.restore();
    }
  }

  // --- broken concrete, from art/cracks.png. Cut per FLOOR TILE so a pit stops
  // a crack exactly where it stops the concrete, and both ends of every piece
  // snapped to canvas pixels, so the source columns are whole and the pieces
  // meet without a seam. `reach` is how far out from the middle of the strip is
  // drawn: Grimace gets all of it, a stomped rat the middle 26 units.
  if (ART.cracks.ready) {
    const ck = ART.cracks;
    const crackAt = function (atX, reach) {
      const left = atX - ck.bw / 2;
      for (let i = 0; i < tiles.length; i++) {
        const t = tiles[i];
        if (t.t !== '#' || t.y < GROUND_Y || t.x - cx > VIEW_W || t.x + TILE - cx < 0) continue;
        const l = Math.round(Math.max(t.x, atX - reach) * S) / S;
        const r = Math.round(Math.min(t.x + TILE, atX + reach) * S) / S;
        if (r <= l) continue;
        ctx.drawImage(ck.img, Math.round((l - left) * S), 0, Math.round((r - l) * S), ck.img.height,
                      l - cx, GROUND_Y, r - l, ck.bh);
      }
    };
    for (let i = 0; i < stomps.length; i++) {
      const sm = stomps[i];
      if (sm.x - cx > VIEW_W + STOMP_REACH || sm.x - cx < -STOMP_REACH) continue;
      crackAt(sm.x, STOMP_REACH * Math.min(1, sm.t / STOMP_GROW));
    }
    if ((state === 'crushed' || crushed) && grim.down && grim.onFloor)
      crackAt(grim.x, ck.bw / 2 * Math.min(1, grim.t / 0.28));
  }

  // --- Grimace, over the top of whatever he is landing on. Not until he has
  // been let go - before that he is nowhere.
  if ((state === 'crushed' || crushed) && grim.drop) {
    const gx = Math.round(grim.x - cx);
    if (!sprite('grimace', grim.down ? 1 : 0, gx, grim.y, false)) {
      // Sized off ART.grimace, not typed in: the art doubled once already, and a
      // literal 92 x 79 here would have gone on drawing the old size.
      px(gx - ART.grimace.bw / 2, grim.y - ART.grimace.bh, ART.grimace.bw, ART.grimace.bh, '#6b3fa0');
    }
  }

  ctx.setTransform(S, 0, 0, S, 0, 0);   // back to canvas space for overlays
  // --- chase vignette
  if (spider.active && spider.burn <= 0 && !torch.active) {
    const near = clamp(1 - (player.x - spider.x - spider.w) / 260, 0, 1);
    ctx.fillStyle = 'rgba(184,54,42,' + (near * 0.30).toFixed(3) + ')';
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  }

  if ((state === 'ending' || state === 'score') && !crushed) renderLoading();
}

/* --- end-of-level truck + box loading ------------------------------------ */
let tally = 0;
// Where the truck's cargo opening sits inside the open-bay tile, as fractions
// of the tile rather than pixels, so re-running tools/make_bg.py at another
// scale cannot silently move the target. Measured off the art: the inner edge
// of the silver frame down to the load deck.
const BAY_IN = { x0: 0.324, x1: 0.695, y0: 0.436, y1: 0.827 };
// 4 x 4, because the opening is square (59 x 59 world units) and so is the box
// art. A 4 x 6 grid squashed every crate to 1.5:1.
const LOAD_COLS = 4, LOAD_ROWS = 4;

// The end of the run. There is no truck sprite any more - the truck is in the
// wall art, backed into the bay - so this only throws the boxes the player
// collected into its cargo opening and stacks them there. Canvas space: the
// caller has already reset the transform, so world coordinates need the camera
// taking off them by hand.
function renderLoading() {
  const t = state === 'score' ? tally : 0;
  const bgo = ART.bgOpen;
  if (!bgo.ready) return;

  const bw = bgo.img.width / S, bh = bgo.img.height / S;
  const left = BG_OPEN_X - bw / 2 - cam.x * BG_PARALLAX;
  const top = (GROUND_Y - bh) - cam.y;
  const x0 = left + bw * BAY_IN.x0, x1 = left + bw * BAY_IN.x1;
  const y0 = top + bh * BAY_IN.y0,  y1 = top + bh * BAY_IN.y1;
  const cw = (x1 - x0) / LOAD_COLS, ch = (y1 - y0) / LOAD_ROWS;

  // One box every 0.05s once the score sheet starts counting, which is what
  // showScore's own boxDelay is timed against.
  const loadT = Math.max(0, t - 1.4);
  const loaded = Math.min(boxesGot, Math.floor(loadT / 0.05));
  const cell = function (i) {
    const c = i % LOAD_COLS, r = Math.floor(i / LOAD_COLS) % LOAD_ROWS;
    return { x: x0 + c * cw, y: y1 - (r + 1) * ch };
  };
  // drawImage, not sprite(): a sprite draws at its own ART size - 26 units -
  // and these have to fit a 15-unit cell inside the truck.
  const bi = ART.box;
  const crate = function (x, y, w, h) {
    if (bi.ready) ctx.drawImage(bi.img, x, y, w, h);
    else { px(x + 1, y + 1, w - 2, h - 2, C.card1); px(x + 1, y + 1, w - 2, 2, C.card2); }
  };
  for (let i = 0; i < loaded; i++) {
    const q = cell(i);
    crate(q.x, q.y, cw, ch);
  }
  // and the one in the air, arcing in off the dock floor. NOT thrown from the
  // player: he walks on past the exit during the ending and finishes about 100
  // units off the right of the screen, so boxes would have popped in at the
  // edge. It shrinks from full size to cell size on the way, which is what
  // sells the depth - it is travelling away from camera into the truck.
  if (loaded < boxesGot && loadT > 0) {
    const k = (loadT % 0.05) / 0.05;
    const q = cell(loaded);
    const sx = VIEW_W * 0.16, sy = GROUND_Y - cam.y - 6;
    const fx = sx + (q.x + cw / 2 - sx) * k;
    const fy = sy + (q.y + ch / 2 - sy) * k - Math.sin(k * Math.PI) * 46;
    const fw = 26 + (cw - 26) * k, fh = 26 + (ch - 26) * k;
    crate(fx - fw / 2, fy - fh / 2, fw, fh);
  }
}

/* ==========================================================================
   13. SCORE SHEET
   ========================================================================== */
const sheetScore = document.getElementById('score');
const rowEls = { box:document.getElementById('rBox'), card:document.getElementById('rCard'),
                 time:document.getElementById('rTime'), clean:document.getElementById('rClean'),
                 total:document.getElementById('rTotal') };
const gradeEl = document.getElementById('grade'), againEl = document.getElementById('again');

// THE CLIP OVER GAME OVER. Optional, like every other asset: drop art/loser.mp4
// or art/loser.webm in and it plays, see-through, behind the text; with neither
// the sheet is just GAME OVER and the button.
// Its SOUND is the awkward half. iPhone Safari will not let a page start audio
// on its own, and nothing the player taps is anywhere near this moment - so the
// video plays MUTED and the sound comes from audio/loser.mp3 through the
// context the first tap already unlocked, the same way every other sound here
// does. Without that file it still tries the video unmuted and falls back to
// muted if the browser refuses, which on a phone it will.
const loserEl = document.getElementById('loserClip');
const LOSER_SRC = ['art/loser.mp4', 'art/loser.webm'];
let loserReady = false, loserBuf = null, loserTry = 0, loserSrc = null, loserPrimed = false;
function nextLoserSrc() {
  if (loserTry >= LOSER_SRC.length) return;
  loserEl.src = LOSER_SRC[loserTry++];
}
loserEl.addEventListener('loadeddata', function () { loserReady = true; });
// Only while still looking for a file that works. Without the guard, an error
// DURING playback moved it on to the next source - a 404 - and killed the clip
// for the rest of the run.
loserEl.addEventListener('error', function () { if (!loserReady) nextLoserSrc(); });
nextLoserSrc();

// The clip's sound arrived as AAC in a FRAGMENTED mp4 (moof/mdat, DASH brand,
// no esds - tools/check_audio.py says as much and tells you to listen). Chrome
// and Safari both decode it, checked, but a plain .mp3 would too, so try either.
const LOSER_SFX = ['audio/loser.m4a', 'audio/loser.mp3'];
function loadLoserSound(i) {
  i = i || 0;
  if (typeof fetch !== 'function' || i >= LOSER_SFX.length) return;
  fetch(LOSER_SFX[i])
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
    .then(function (b) {
      return new Promise(function (res, rej) { ac.decodeAudioData(b, res, rej); });
    })
    .then(function (buf) { loserBuf = buf; })
    .catch(function () { loadLoserSound(i + 1); });   // the video then tries for itself
}

// It runs until RUN IT BACK, so both halves loop - and they loop on the SAME
// period, the video's, or they walk apart: the sound is 2.83s against 2.77s of
// picture, which is a frame and a half of drift per pass and half a second of
// it by the tenth. `loopEnd` on the source is what holds them together; the
// 0.06s it cuts is the tail of the sound.
// The gain is fixed at 0.9 and the mute goes through `dry` like everything
// else: set from `muted` here instead, a clip started while muted would stay
// silent through an unmute, because nothing revisits this node.
// A phone only lets a page start video off a user's own tap. Nobody taps
// anything at the moment of a crush, so the tap that starts the RUN is spent on
