// it here: play it muted and stop it again straight away, which leaves the
// element allowed to play later. Harmless where it is not needed.
function primeLoser() {
  if (loserPrimed) return;
  loserPrimed = true;
  loserEl.muted = true;
  const p = loserEl.play();
  if (p && p.then) p.then(function () {
    loserEl.pause();
    try { loserEl.currentTime = 0; } catch (e) { /* not seekable yet */ }
  }).catch(function () { /* it will try again for real at GAME OVER */ });
}

function playLoser() {
  stopLoser();
  if (loserBuf && ac && ac.state === 'running') {
    const s = ac.createBufferSource(), g = ac.createGain();
    s.buffer = loserBuf; g.gain.value = LOSER_VOL;
    s.loop = true;
    s.loopStart = 0;
    s.loopEnd = isFinite(loserEl.duration) ? Math.min(loserBuf.duration, loserEl.duration) : loserBuf.duration;
    s.connect(g); g.connect(dry); s.start();
    loserSrc = s;
    loserEl.muted = true;
  } else {
    loserEl.muted = muted;
  }
  // NOT GATED ON `loadeddata`. A phone does not pre-load video the way a
  // desktop does, so that event had not fired by the time anyone got crushed -
  // the sound played and the picture never did, which is exactly what came back
  // from the first real phone. Just ask it to play; if it cannot, drop the
  // class again so the sheet is the words and the button, as it is with no clip
  // at all.
  sheetScore.classList.add('clip');
  loserEl.loop = true;
  try { loserEl.currentTime = 0; } catch (e) { /* not seekable yet */ }
  const p = loserEl.play();
  if (p && p.catch) p.catch(function () {
    loserEl.muted = true;
    loserEl.play().catch(function () { sheetScore.classList.remove('clip'); });
  });
}

function stopLoser() {
  if (loserSrc) {
    try { loserSrc.stop(); } catch (e) { /* already stopped */ }
    loserSrc = null;
  }
  loserEl.pause();
  try { loserEl.currentTime = 0; } catch (e) { /* not seekable */ }
}

// THE CLIP IS ONE GOP. 83 frames, one keyframe, at the front - and there is no
// second one to be had without an encoder, so every loop re-primes the decoder
// from the top of the file. tools/make_loser.py took away the two things that
// made that seek harder than it needed to be - a DASH-fragmented container, and
// an edit list that pointed presentation time zero at the frame AFTER the
// keyframe - but a phone that drops a pass anyway leaves a frozen picture over
// a sound that carries on, which is what came back from a real one: it froze on
// every other loop. So watch it. If the picture has not moved for CLIP_STALL
// while it is supposed to be running, put it back on the keyframe and start it
// again; three of those in a row and the file is reloaded, and if that will not
// play either the sheet goes back to being the words and the button.
const CLIP_STALL = 0.5;          // seconds of a still picture before it is stuck
const CLIP_WELL  = 1.0;          // seconds of moving picture that count as recovered
let clipAt = -1, clipStuck = 0, clipWell = 0, clipKicks = 0;
function watchLoser(dt) {
  if (!(state === 'score' && crushed && sheetScore.classList.contains('clip'))) {
    clipAt = -1; clipStuck = 0; clipWell = 0; clipKicks = 0; return;
  }
  const t = loserEl.currentTime;
  if (loserEl.paused) {          // backgrounded, or it never got going
    clipAt = t; clipStuck = 0;
    const r = loserEl.play(); if (r && r.catch) r.catch(function () {});
    return;
  }
  if (t !== clipAt) {            // the picture moved
    clipAt = t; clipStuck = 0;
    // CLIP_WELL, not the first frame that moves: a kick SEEKS, so the frame
    // after one always looks like progress, and counting that as recovery
    // meant clipKicks could never reach 3 and the reload below was dead code.
    clipWell += dt;
    if (clipWell > CLIP_WELL) clipKicks = 0;
    return;
  }
  clipStuck += dt;
  if (clipStuck < CLIP_STALL) return;
  clipStuck = 0; clipWell = 0; clipKicks++;
  // Back to the keyframe, never to wherever the sound has got to: a seek into
  // the middle of this file is the expensive one, and a stopped picture is
  // already the glitch - the two running a few frames apart is not.
  if (clipKicks >= 3) { clipKicks = 0; loserEl.load(); }
  try { loserEl.currentTime = 0; } catch (e) { /* not seekable */ }
  const p = loserEl.play();
  if (p && p.catch) p.catch(function () { sheetScore.classList.remove('clip'); });
}

// Every lookup is getElementById - sim.js stubs only that, not querySelector.
const cbEl = document.getElementById('cardBanner'), cbArt = document.getElementById('cbArt');
const cbKicker = document.getElementById('cbKicker'), cbName = document.getElementById('cbName');
let cbTimer = null;

// Crop one element to one cell of the cards_menu strip. The zoom and the step
// both come from CARD_NAMES.length, so the sheet growing a card is two list
// entries and two divs - no CSS arithmetic to forget, which is exactly what
// went wrong when it went from five cards to six.
function paintCard(el, design) {
  if (!el) return;
  el.style.backgroundSize = (CARD_NAMES.length * 100) + '% 100%';
  el.style.backgroundPosition = (design * CARD_STEP) + '% 0';
}
const cardMinis = CARD_NAMES.map(function (_, i) { return document.getElementById('cbMini' + i); });
const cardSlots = CARD_NAMES.map(function (_, i) { return document.getElementById('cardSlot' + i); });
for (let i = 0; i < CARD_NAMES.length; i++) { paintCard(cardMinis[i], i); paintCard(cardSlots[i], i); }
paintCard(document.getElementById('tsCard'), TORCH_DESIGN);

// The run so far. Read straight off `cards` rather than a tally of its own, so
// it cannot drift from what has actually been picked up.
function paintRun(justGot) {
  for (let i = 0; i < cardMinis.length; i++) {
    const el = cardMinis[i];
    if (!el) continue;
    let got = false;
    for (let j = 0; j < cards.length; j++) if (cards[j].got && cards[j].design === i) got = true;
    el.classList.toggle('got', got);
    el.classList.toggle('new', i === justGot);
  }
}

// The torch-card graphic, art/torch-splash.png, any size; it is fitted to the
// screen, never stretched. Missing, the splash falls back to the same card's
// cell on the shelf sheet - tools/make_cards.py builds both from one drawing.
const tsEl = document.getElementById('torchSplash'), tsImg = document.getElementById('tsImg');
(function () {
  const im = new Image();
  im.onload = function () { if (tsImg) tsImg.src = im.src; if (tsEl) tsEl.classList.add('custom'); };
  im.src = 'art/torch-splash.png';
})();
function showTorchSplash(on) { if (tsEl) { if (on) tsEl.classList.add('in'); else tsEl.classList.remove('in'); } }

function showCardBanner(design) {
  if (!cbEl || !cbArt) return;
  const n = CARD_NAMES[design] || ['', 'CARD'];
  paintCard(cbArt, design);
  paintRun(design);
  cbKicker.textContent = n[0]; cbName.textContent = n[1];
  cbEl.classList.add('in');
  if (cbTimer && typeof clearTimeout === 'function') clearTimeout(cbTimer);
  cbTimer = setTimeout(function(){ cbEl.classList.remove('in'); }, 2600);
}
function setRow(el, label, val) { el.children[0].textContent = label; el.children[1].textContent = val; el.classList.add('in'); }

function showScore() {
  const s = computeScore();
  state = 'score'; tally = 0;
  sheetScore.classList.remove('gone');
  for (const k in rowEls) rowEls[k].classList.remove('in');
  cardSlots.forEach(function(el){ el.classList.remove('got'); });
  gradeEl.classList.remove('in'); againEl.classList.remove('in');
  showPad(false);                   // RUN IT BACK is where the d-pad is
  stopLoser();                      // a finished run after a crushed one
  sheetScore.classList.toggle('over', crushed);
  sheetScore.classList.remove('clip');

  // Crushed: no tally at all. Nothing was collected that counts, so there is
  // nothing to count up - GAME OVER, the button, and the clip if it is there.
  if (crushed) {
    gradeEl.textContent = 'GAME OVER';
    gradeEl.classList.add('over');
    gradeEl.classList.add('in');
    againEl.classList.add('in');
    playLoser();
    return;
  }

  const boxDelay = 1400 + boxesGot * 50;
  setTimeout(function(){ setRow(rowEls.box,  'boxes  ' + boxesGot + '/' + TOTAL_BOXES, '+' + s.boxPts); chime(698, 1.2, .055); }, boxDelay);
  setTimeout(function(){ setRow(rowEls.card, 'cards  ' + cardsGot + '/' + TOTAL_CARDS, '+' + s.cardPts); chime(784, 1.2, .055); }, boxDelay + 500);
  cards.forEach(function(c){
    if (!c.got) return;
    setTimeout(function(){
      const el = cardSlots[c.design];
      if (el) el.classList.add('got');
      chime(660 + c.design * 110, 1.1, .05);
    }, boxDelay + 620 + c.design * 130);
  });
  setTimeout(function(){ setRow(rowEls.time, 'time  ' + clock.toFixed(1) + 's', '+' + s.timePts); chime(880, 1.2, .055); }, boxDelay + 1000);
  setTimeout(function(){ setRow(rowEls.clean,'no-hit bonus', s.cleanPts ? '+' + s.cleanPts : '—'); chime(988, 1.2, .055); }, boxDelay + 1500);
  setTimeout(function(){ setRow(rowEls.total,'TOTAL', String(finalScore)); chime(1046, 1.8, .065); }, boxDelay + 2100);
  setTimeout(function(){
    gradeEl.textContent = grade;
    gradeEl.classList.remove('over');
    gradeEl.classList.add('in');
    chime(1568, 2.6, .075);
  }, boxDelay + 2600);
  setTimeout(function(){ againEl.classList.add('in'); }, boxDelay + 3100);
}
// RUN IT BACK always rolls a NEW layout. ?seed=N picks the layout you START
// on - it is not a lock on the button, and reading it here made the button
// look broken on exactly the URLs used to hold one layout still. Reload the
// page to replay a seed. ?seed=classic is a MODE, not a seed, so it stays put.
againEl.addEventListener('click', function(){
  sheetScore.classList.add('gone');
  showPad(true);
  stopLoser();
  newLevel(SEED_PARAM === 'classic' ? 'classic' : null);
  resetRun();
});

/* ==========================================================================
   14. LOOP
   ========================================================================== */
const hud = document.getElementById('hud');
const DEBUG = location.search.indexOf('fps') >= 0;   // append ?fps to the URL to measure
let last = 0, acc = 0, running = false, fps = 60, fpsT = 0, fpsN = 0;

function frame(now) {
  requestAnimationFrame(frame);
  if (!running) return;
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.25) dt = 0.25;                    // Safari pauses rAF when backgrounded
  acc += dt;
  let guard = 0;
  while (acc >= STEP && guard++ < 8) { if (state === 'score') tally += STEP; else update(STEP); acc -= STEP; }
  if (state === 'score') tally += 0;
  render();
  watchLoser(dt);

  fpsN++; fpsT += dt;
  if (fpsT >= 0.5) { fps = Math.round(fpsN / fpsT); fpsT = 0; fpsN = 0; }
  const dbg = DEBUG ? ' &nbsp;·&nbsp; ' + fps + 'fps @ ' + (VIEW_W * S) + '\u00d7' + (VIEW_H * S)
    + ' &nbsp;&middot;&nbsp; ' + window.innerWidth + 'x' + window.innerHeight
    + ' safe ' + Math.round(safeSeen.top) + '/' + Math.round(safeSeen.bottom)
    + ' &nbsp;&middot;&nbsp; seed ' + levelSeed : '';

  if (state === 'score') hud.innerHTML = dbg;
  else if (spider.active && spider.burn <= 0 && !torch.active)
    hud.innerHTML = '<i>RUN</i> &nbsp; <b>' + boxesGot + '</b>/' + TOTAL_BOXES + ' boxes &nbsp;·&nbsp; ' + clock.toFixed(1) + 's' + dbg;
  else
    hud.innerHTML = '<b>' + boxesGot + '</b>/' + TOTAL_BOXES + ' boxes &nbsp;·&nbsp; <b>' + cardsGot + '</b>/' + TOTAL_CARDS + ' cards &nbsp;·&nbsp; ' + clock.toFixed(1) + 's' + dbg;
}

document.addEventListener('visibilitychange', function(){
  if (document.hidden) return;
  last = performance.now(); acc = 0;
  // A browser pauses a silent video in a hidden page to save power - Chrome says
  // so in as many words - and this one is silent by design, its sound being a
  // separate file. So pick it back up when the page comes back, if GAME OVER is
  // still on screen.
  if (state === 'score' && crushed && sheetScore.classList.contains('clip'))
    loserEl.play().catch(function () {});
});

const splash = document.getElementById('splash');
// The title card replaces the text title only once it has actually loaded. The
// <img> starts loading before this script runs, so it may already be done.
const titleArt = document.getElementById('titleArt');
function titleReady() { if (titleArt.naturalWidth) splash.classList.add('art'); }
titleArt.addEventListener('load', titleReady);
if (titleArt.complete) titleReady();
function start() {
  unlockAudio();
  primeLoser();
  splash.classList.add('gone');
  showPad(true);
  resize(); resetRun();
  last = performance.now(); acc = 0; running = true;
}
splash.addEventListener('touchstart', function(e){ e.preventDefault(); start(); }, { passive:false });
splash.addEventListener('click', start);

resize();
resetRun();
requestAnimationFrame(frame);
</script>
</body>
</html>
